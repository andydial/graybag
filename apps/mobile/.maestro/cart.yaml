# The cart, on a real build against real staging — `E14-24`, first flow.
#
# ## Why this exists at all
#
# Three defects reached Andy's phone in one day — a menu that said "not published", an Add
# Child that said "function was not found", and an app that looked like a wireframe — and the
# unit suite was green through all of it. None of them were visible from a test that never
# rendered a screen against a real backend. This is the net that catches that class.
#
# ## Why the cart is first
#
# It carries more rules than any other screen: the GST split, the child and date binding, the
# tax-exclusive prices, and the AR7 rule that the word "sign in" appears nowhere until the gate.
# If those hold on a device, most of the app's logic is proven.
#
# ## Running it
#
#     npx maestro test apps/mobile/.maestro/cart.yaml
#
# Against the staging dev client or a staging build — the app id carries `.staging`, so this
# cannot accidentally drive a production install (`app.config.js` STAGING_SUFFIX).
# The ANDROID package, capitals and all. `com.Gracord.Graybag` matches the Play Console exactly
# (`E17-35`) and an `applicationId` cannot be changed after publication, so the capitals are not
# ours to tidy. This line previously read `com.gracord.graybag.staging` — the **iOS** bundle id
# with a staging suffix — and Android package names are case-sensitive, so the flow looked for an
# app that was never going to be there.
#
# That is the second half of `E01-26`: combined with the unset `APP_ENV` in the workflow, this
# job could not have passed on Android under any circumstances, which is why it has never once
# been observed green.
#
# `scripts/check-maestro-ids.mjs` now asserts this value against `app.config.js`, so it cannot
# drift again. When the iOS matrix leg arrives this becomes a `--env` substitution rather than a
# literal, because the two platforms genuinely disagree on the id.
appId: com.Gracord.Graybag.staging
---
- launchApp:
    clearState: true

# --- browse, signed out. AR7: no gate before checkout. ---
- tapOn:
    id: 'tab-menu'

# A cold launch has no school, so the Menu tab opens the picker — which since §6.1.1 also
# carries the welcome. The flow used to assume the menu appeared straight away, which on a
# `clearState: true` launch it never does.
- assertVisible:
    id: 'school-picker'
# A school ROW, and the id pattern has to say so.
#
# This was `school-picker-.*` with `index: 0`, and that is why the flow has never got past this
# step. `SchoolPicker` puts nine other testIDs under the same prefix — `school-picker-search`,
# `-stale`, `-welcome`, `-loading`, `-error`, `-empty`, `-no-match`, `-request-footer`,
# `-request-from-list` — and the **search field is rendered before the list**, so `index: 0`
# matched the search box. Tapping it focuses the field and opens the keyboard. No navigation
# happens, `MenuScreen` never mounts, and the next line fails with `screen-menu is visible =
# false` — which reads exactly like a slow or broken menu and is nothing of the kind.
#
# A row's id is `school-picker-<school.id>` and `school.id` is a uuid, so matching a uuid-shaped
# suffix hits rows and only rows. Still no hard-coded school: staging's seed changes, and a flow
# that breaks when it does gets disabled rather than fixed.
- tapOn:
    id: 'school-picker-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    index: 0

# `extendedWaitUntil`, not `assertVisible`, and this is the only assertion in the flow that gets
# it. Picking a school is the **first thing in the app that waits on the network**: everything
# before it is local, and this fetches a 47-item menu with its dishes and prices over whatever
# connection a cold CI emulator has. A default assertion gives it a few seconds and reports
# `screen-menu is visible = false`, which is indistinguishable from the screen being wrong.
#
# 45s is deliberately generous. The cost of it being too short is a 29-minute run that proves
# nothing; the cost of it being too long is 45 seconds, and only on a run that was going to fail
# anyway. If this ever legitimately takes 45 seconds on a phone, that is a P0 in its own right
# and the flow timing out is the correct outcome.
- extendedWaitUntil:
    visible:
      id: 'screen-menu'
    timeout: 45000

# Add the first dish the menu offers. Deliberately not a hard-coded dish name: staging's menu
# is seeded data that changes, and a flow that breaks when a seed changes gets disabled rather
# than fixed.
- tapOn:
    id: 'menu-row-.*'
    index: 0
- assertVisible:
    id: 'screen-dish-detail'
# `screen-dish-detail-add-button`, NOT `screen-dish-detail-button`. The button lives inside an
# `AddToCart` sub-component whose own testID is `…-add`, so the id has both segments. The
# earlier form existed nowhere and would have hung until Maestro timed out —
# `check-maestro-ids.mjs` could not catch it because both halves are real in that one file.
- tapOn:
    id: 'screen-dish-detail-add-button'

# --- the cart ---
- tapOn:
    id: 'tab-cart'
- assertVisible:
    id: 'screen-cart'

# ux-spec §5.7 — a parent must never be one tap from paying without seeing who it is for.
# Signed out, that block says so in words rather than naming a child it cannot resolve.
#
# **Asserted before the scroll below, and that order is load-bearing.** This block is the first
# card in the cart; `CartTotals` is the last, under the break-time picker. On the 320x640 CI
# emulator they are not on screen together, so asserting this after scrolling to the totals
# would fail on a cart that is behaving perfectly.
- assertVisible: 'No child chosen yet'

# The payable total is on the button itself, not on a later screen. Sticky — it lives OUTSIDE
# the ScrollView — so it holds at any scroll position.
- assertVisible: 'Place order.*'

# The GST split, which is the thing most worth pinning on a device: SC2 says menu prices are
# GST-exclusive and M2 fixes the split at CGST 2.5% + SGST 2.5% for Mohali.
#
# `scrollUntilVisible`, because `CartTotals` is the LAST card in the ScrollView and is below the
# fold on a cold CI emulator. A plain `assertVisible` here reported `"Subtotal" is visible =
# false` while the screenshot showed a perfectly correct cart — the rows existed, they were just
# further down. That is indistinguishable from "the GST breakdown is missing", which is a bug
# worth failing over, so the flow has to be able to tell them apart.
- scrollUntilVisible:
    element:
      id: 'cart-subtotal'
    direction: DOWN
- assertVisible: 'Subtotal'
- assertVisible: 'CGST 2.5%'
- assertVisible: 'SGST 2.5%'
- assertVisible: 'Total'
- assertVisible: 'Menu prices exclude GST.*'

# R11: Mohali only. An IGST line appearing here means multi-state logic leaked in.
#
# After the scroll deliberately: `assertNotVisible` on a region that is off screen passes for
# the wrong reason, and this is a non-negotiable rather than a nicety.
- assertNotVisible: 'IGST'

# --- the gate, and only here (AR7 / ux-spec F1) ---
# Nothing before this point may have mentioned signing in. This is the assertion that would
# have caught a well-meaning "please sign in to continue" added to the cart.
- tapOn: 'Place order.*'
- assertVisible:
    id: 'screen-sign-in'

# F1: the cart survives the trip to the gate. Losing it here is the single most likely place
# to lose a first order.
- back
- assertVisible:
    id: 'screen-cart'

# The line the cart is proving it kept — asserted by testID rather than the word "Total",
# because `Total` also matches inside `Subtotal` and an assertion that passes on the wrong row
# is not evidence the cart survived.
#
# Scrolled to for the same reason as above: coming back from the gate, the cart is at the top
# and the totals are below the fold. `scrollUntilVisible` is a no-op if it is already on screen,
# so this does not depend on whether the scroll position is restored.
- scrollUntilVisible:
    element:
      id: 'cart-total'
    direction: DOWN
- assertVisible:
    id: 'cart-total'
