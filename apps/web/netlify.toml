# Netlify configuration for the public site (`E12-09`, decision `A5`).
#
# The site is fully static: no adapter, no functions, no runtime. The one thing that writes —
# the enquiry form — posts to a Supabase Edge Function in `ap-south-1`, because `A5` rules
# Netlify Functions out for API work (no India region) and `A4` requires writes to go through
# an Edge Function.
#
# **The base directory is set on the site, not here.** This file lives in `apps/web`, and Netlify
# resolves a `base` key relative to the file it is reading — so `base = "apps/web"` here resolved
# to `apps/web/apps/web` and the deploy failed with "Base directory does not exist". The
# repository root is kept clean of config (`CLAUDE.md`), so the site's build settings carry the
# base and the paths below are relative to it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------- deploy gating
#
# `E12-30`. **Every pull request gets a preview. Production never publishes by itself.**
#
# The `ignore` command below is Netlify's "should I skip this build?" hook, and its exit codes are
# INVERTED: 0 skips, 1 builds. The decision is made in `scripts/lib/netlify-gate.mjs`, which is
# unit-tested, because getting the inversion backwards fails OPEN — production would publish on
# every merge to `main`, which is the exact thing being prevented.
#
# Paths are relative to the site's base directory (`apps/web`), which is set on the site rather
# than here — see the note at the top of this file. Hence the `../../`.
#
# To promote, see `docs/netlify-deploys.md`. In one line: push a commit whose **subject** contains
# `[promote]`, or trigger a deploy with `PROMOTE_TO_PRODUCTION=true`.

[context.production]
  command = "npm run build"
  ignore  = "bash ../../scripts/netlify-should-build.sh"

# Deploy previews are what pull requests get, and they always build. A gate on these would defeat
# the reason they exist — reviewing a change before it is merged, not after.
[context.deploy-preview]
  command = "npm run build"

# A push to any non-production branch. Same reasoning.
[context.branch-deploy]
  command = "npm run build"

# ---------------------------------------------------------------------------- headers

[[headers]]
  for = "/*"

  [headers.values]
    # No third-party anything: no embeds, no analytics, no CDN scripts. The CSP is the
    # enforcement of what `scripts/check-build.mjs` asserts structurally, so a future edit that
    # slips a script tag past the build check still fails in the browser.
    #
    # `connect-src` names the Supabase project the enquiry form posts to. It is set here rather
    # than left open because a form endpoint is exactly the thing worth pinning.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Nothing on this site needs a camera, a microphone or a location.
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options        = "DENY"

    # **Delete this line at the DNS cutover (`E12-10`), and not before.**
    #
    # The back office has to be reachable from a phone, which means deploying — and the
    # marketing pages ride along on the same build while still waiting on legal review. A
    # Netlify subdomain is a public URL, so the whole site is held out of search at the header
    # level as well as in `robots.txt`. Two mechanisms because they fail differently: a header
    # covers a crawler that ignores `robots.txt`, and `robots.txt` covers one that never
    # requests the page.
    X-Robots-Tag           = "noindex, nofollow"

# Fingerprinted build output can be cached forever; nothing else can, because the HTML is how a
# visitor discovers that anything changed.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The images are not fingerprinted — they are written by `build-web-assets.mjs` under stable
# names — so they get a day, not a year. Long enough to help a repeat visit, short enough that
# re-shot photography appears without a cache-busting scramble.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------------------------- redirects

# `trailingSlash: 'never'` in the Astro config, mirrored here so both agree. Two URLs for one
# page splits search ranking and makes the canonical tag do work the server should do.
# ---------------------------------------------------------------- analytics ingest
#
# `E12-38`. PostHog, reverse-proxied through our own domain.
#
# The alternative — their CDN snippet — would need `script-src` opened to a third-party host and
# would trip `check-build.mjs`, which fails the build on any third-party asset. Both guards are
# worth keeping, so `posthog-js` is bundled from npm and its ingest is proxied here instead. The
# browser therefore only ever talks to graybag, `script-src 'self'` is untouched, and `connect-src`
# needs no widening.
#
# It also survives the ad-blockers that drop a `*.posthog.com` request, which is PostHog's own
# stated reason for documenting this pattern.
#
# `/ingest/static/*` is split out because the SDK fetches its own assets from a different origin
# than it posts events to.
[[redirects]]
  from   = "/ingest/static/*"
  to     = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/ingest/*"
  to     = "https://eu.i.posthog.com/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/privacy/"
  to     = "/privacy"
  status = 301

[[redirects]]
  from   = "/terms/"
  to     = "/terms"
  status = 301

[[redirects]]
  from   = "/refunds/"
  to     = "/refunds"
  status = 301

# The legacy Bubble site's paths, so links already in the world keep working after the DNS
# cutover (`E12-09`, `E12-10`). Everything on the old site that mattered is now one page.
[[redirects]]
  from   = "/findoutmore"
  to     = "/#enquiry"
  status = 301

[[redirects]]
  from   = "/privacy-policy"
  to     = "/privacy"
  status = 301
