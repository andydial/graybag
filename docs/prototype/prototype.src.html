<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrayBag — clickable prototype</title>
<style>
/* ==========================================================================
   GrayBag prototype — brand from Graybag_Design Package, IA from docs/ux-spec.md
   ========================================================================== */
:root{
  --green:#00af52;        /* Primary   */
  --deep:#145f48;         /* Secondary */
  --amber:#ffbb39;        /* Secondary — warnings that are not errors */
  --lime:#b3cf3f;         /* Accent    */
  --pale:#e5ea98;         /* Accent    */
  --ink:#12211a;
  --muted:#7b8a83;
  --line:#e8ebe9;
  --field:#f1f3f2;
  --danger:#c0392b;
  --radius:22px;
  /* VAG Rounded Next is the brand face; licence unconfirmed (ux-spec §3.2), so the
     prototype uses the nearest rounded stack available without redistributing anything. */
  --font:'SF Pro Rounded','Nunito',ui-rounded,-apple-system,'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e1512;font-family:var(--font);color:var(--ink);
     display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:28px 20px 60px}

/* ---------- meal packs (E21) ---------- */
.packcard{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:20px;padding:16px 17px;margin:0 0 12px;cursor:pointer;font-family:inherit}
.packcard:hover{border-color:var(--green)}
.packcard .pname{font-size:16.5px;font-weight:800;color:var(--ink)}
.packcard .prule{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.packcard .prow{display:flex;align-items:baseline;gap:9px;margin-top:11px}
.packcard .pprice{font-size:20px;font-weight:800;color:var(--green)}
.packcard .pwas{font-size:13px;color:var(--muted);text-decoration:line-through}
.save{display:inline-block;background:var(--pale);color:#4a5a12;font-size:11px;font-weight:800;
  padding:4px 9px;border-radius:999px;letter-spacing:.02em}
.balance{background:var(--deep);color:#fff;border-radius:22px;padding:18px 19px;margin:0 16px 14px;position:relative;overflow:hidden}
.balance .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.13em;opacity:.72}
.balance .big{font-size:30px;font-weight:800;margin:4px 0 2px;position:relative}
.balance .sub{font-size:12.5px;opacity:.85;position:relative;line-height:1.5}
.meter{height:7px;border-radius:99px;background:rgba(255,255,255,.22);margin:13px 0 0;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--lime)}
.packbar{display:flex;gap:12px;align-items:flex-start;background:#f4f9f5;border:1.5px solid #cfe6d8;
  border-radius:18px;padding:14px 15px;margin:14px 16px 0}
.packbar.no{background:#fdf7ec;border-color:#f0dcae}
.packbar .pb-t{font-size:13.5px;font-weight:800;color:var(--ink)}
.packbar .pb-b{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.pswitch{flex:0 0 46px;width:46px;height:27px;border-radius:99px;border:0;background:#cfd8d3;position:relative;cursor:pointer;margin-top:2px}
.pswitch.on{background:var(--green)}
.pswitch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .16s}
.pswitch.on i{left:22px}

/* ---------- the pack planner ---------- */
.planrow{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:#fff;width:100%;text-align:left;font-family:inherit;cursor:pointer;border-left:0;border-right:0;border-top:0}
.planrow.off{background:#fafbfa;cursor:default}
.planrow .pd{flex:1}
.planrow .pdate{font-size:14px;font-weight:800;color:var(--ink)}
.planrow.off .pdate{color:var(--muted)}
.planrow .pmeta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.planrow .pitems{font-size:12.5px;color:var(--green);font-weight:700;margin-top:5px;line-height:1.5}
.planrow .pwhy{font-size:12px;color:#8a6400;margin-top:4px;line-height:1.5}
.tick{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);margin-top:2px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.bad{background:var(--amber);border-color:var(--amber);color:#4a3600}
.planbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:13px 16px 16px}
.planbar .cnt{font-size:12.5px;color:var(--muted);margin-bottom:9px;text-align:center}
.planbar .cnt b{color:var(--ink)}
.planbar .cnt.bad{color:#8a6400}

/* ---------- the control rail: how Andy reaches every state deliberately ---------- */
#rail{width:250px;flex:0 0 250px;color:#cfe0d7;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto}
#rail h1{font-size:15px;margin:0 0 4px;color:#fff;letter-spacing:.2px}
#rail p.sub{font-size:11.5px;line-height:1.5;color:#8fa79b;margin:0 0 18px}
#rail h2{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#6f8a7c;margin:18px 0 7px}
#rail button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#cfe0d7;
  font:inherit;font-size:12.5px;padding:6px 9px;border-radius:8px;cursor:pointer}
#rail button:hover{background:#1b2924}
#rail button.on{background:var(--green);color:#fff;font-weight:600}
#rail .note{font-size:10.5px;color:#6f8a7c;line-height:1.5;margin:6px 0 0;padding:0 9px}

/* ---------- device ---------- */
#device{width:390px;height:844px;background:#fff;border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 0 0 11px #1c2723,0 0 0 13px #2f3d38,0 26px 70px rgba(0,0,0,.55);flex:0 0 390px}
#screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.statusbar{height:52px;flex:0 0 52px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 7px;font-size:14px;font-weight:600;letter-spacing:.2px}
.statusbar.on-green{color:#fff}
/* `min-height:0` is load-bearing. A `flex:1` item in a column container defaults to
   `min-height:auto`, which refuses to shrink below its content — so `overflow-y:auto` never
   scrolls and the tail of the content is simply clipped by the parent's fixed height. That is
   why the cart's GST footnote and Add Child's button label were both sliced: one container
   defect, two symptoms. */
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.body.has-sticky{padding-bottom:16px}
.sheet .inner{min-height:0}
.homebar{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.homebar i{display:block;width:140px;height:5px;border-radius:3px;background:#12211a;opacity:.85}
.homebar.on-green i{background:#fff;opacity:.9}

/* ---------- brand furniture ---------- */
.pattern{position:absolute;inset:0;background-size:520px;background-repeat:repeat;opacity:.14;pointer-events:none}
.greenfill{position:relative;background:var(--green)}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 12px}
.brandmark{display:flex;align-items:center;gap:9px}
.brandmark img{height:30px;display:block}
.wordmark{font-size:22px;font-weight:800;color:var(--green);letter-spacing:-.6px}
.carticon{position:relative;width:40px;height:40px;border-radius:14px;background:var(--field);
  display:grid;place-items:center;border:0;cursor:pointer}
.carticon .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;
  background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;
  padding:0 5px;border:2px solid #fff}

.pad{padding:0 20px}
h2.title{font-size:23px;font-weight:800;margin:2px 0 3px;letter-spacing:-.5px}
.eyebrow{font-size:12.5px;color:var(--muted);font-weight:600;margin:0}
.h-green{color:var(--green)}

.search{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:16px;padding:13px 15px;margin:12px 0}
.search input{border:0;background:transparent;font:inherit;font-size:14.5px;width:100%;outline:none;color:var(--ink)}
.search svg{flex:0 0 18px;opacity:.42}

/* ---------- "Delivering to" — the most important control on the home screen ---------- */
.deliver{border-radius:var(--radius);overflow:hidden;margin:4px 0 22px;cursor:pointer;border:0;
  padding:0;width:100%;text-align:left;font:inherit;display:block}
.deliver .top{background:var(--green);padding:17px 19px 15px;position:relative;color:#fff}
.deliver .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;opacity:.85}
.deliver .who{font-size:20px;font-weight:800;margin:3px 0 1px;letter-spacing:-.3px;position:relative}
.deliver .where{font-size:13px;opacity:.92;position:relative}
.deliver .band{background:var(--deep);color:#fff;padding:11px 19px;display:flex;align-items:center;
  justify-content:space-between;font-size:13px;font-weight:600}
.deliver .band .arrow{font-size:17px}

.sectionhead{display:flex;align-items:center;gap:12px;margin:24px 0 13px}
.sectionhead::before,.sectionhead::after{content:'';flex:1;height:1.5px;background:var(--green);opacity:.28}
.sectionhead span{font-size:16px;font-weight:800;color:var(--green)}

/* ---------- dish cards ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:2px 20px 26px}
.card{border:0;background:transparent;padding:0;text-align:left;font:inherit;cursor:pointer;display:block}
.thumb{position:relative;width:100%;aspect-ratio:1/.86;border-radius:18px;overflow:hidden;background:var(--field)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .noimg{position:absolute;inset:0;background:var(--pale);background-size:180px;opacity:1}
.thumb .noimg span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
  color:var(--deep);font-weight:700;text-align:center;padding:12px;line-height:1.4}
.mark{position:absolute;top:9px;left:9px;width:19px;height:19px;border-radius:4px;background:#fff;
  display:grid;place-items:center;border:1.6px solid #1f8a3d}
.mark i{width:8.5px;height:8.5px;border-radius:50%;background:#1f8a3d;display:block}
.mark.egg{border-color:#c98a00}.mark.egg i{background:#c98a00}
.mark.nonveg{border-color:#a4262c}.mark.nonveg i{background:#a4262c}
.allerg{position:absolute;top:8px;right:8px;background:var(--amber);color:#3d2c00;font-size:10.5px;
  font-weight:800;padding:4px 8px;border-radius:9px;box-shadow:0 2px 7px rgba(0,0,0,.16)}
.cname{font-size:13.5px;font-weight:700;margin:9px 0 2px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cprice{font-size:13.5px;font-weight:800;color:var(--green)}
.crow{display:flex;gap:13px;padding:0 20px 15px;overflow-x:auto;scrollbar-width:none}
.crow::-webkit-scrollbar{display:none}
.crow .card{flex:0 0 150px}

/* ---------- tabs / chips ---------- */
.tabstrip{display:flex;gap:22px;padding:5px 20px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--line)}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip button{border:0;background:transparent;font:inherit;font-size:14px;color:var(--muted);
  font-weight:600;padding:9px 0 11px;cursor:pointer;white-space:nowrap;position:relative}
.tabstrip button.on{color:var(--green);font-weight:800}
.tabstrip button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1.5px;height:3px;
  background:var(--green);border-radius:3px}

/* ---------- tab bar ---------- */
.tabbar{display:flex;border-top:1.5px solid var(--line);background:#fff;flex:0 0 auto}
.tabbar button{flex:1;border:0;background:transparent;padding:11px 0 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:10px;
  color:var(--muted);font-weight:600}
.tabbar button.on{color:var(--green)}
.tabbar svg{width:23px;height:23px}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;border:0;border-radius:30px;padding:16px;font:inherit;font-size:15.5px;
  font-weight:700;cursor:pointer;background:var(--green);color:#fff;text-align:center}
.btn:disabled{background:#d3dbd7;color:#8d9a94;cursor:not-allowed}
.btn.deep{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--green);border:1.6px solid #d5e5db}
.btn.amber{background:var(--amber);color:#3d2c00}
.btn.small{padding:11px;font-size:13.5px;border-radius:22px}
.sticky{padding:13px 20px calc(13px + env(safe-area-inset-bottom));background:#fff;
  border-top:1.5px solid var(--line);flex:0 0 auto}

/* ---------- states: skeleton, empty, banners ---------- */
@keyframes sheen{0%{background-position:-260px 0}100%{background-position:260px 0}}
.sk{background:linear-gradient(90deg,#eef1ef 25%,#f7f9f8 50%,#eef1ef 75%);background-size:520px 100%;
    animation:sheen 1.25s linear infinite;border-radius:10px}
.sk.thumb{aspect-ratio:1/.86;border-radius:18px}
.sk.line{height:12px;margin:9px 0 5px}
.sk.line.short{width:52%}

.empty{padding:46px 34px;text-align:center}
.empty .art{width:104px;height:104px;border-radius:34px;margin:0 auto 18px;background:var(--pale);
  background-size:150px;display:grid;place-items:center}
.empty .art img{width:52px;opacity:.9}
.empty h3{font-size:17.5px;font-weight:800;margin:0 0 7px}
.empty p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 20px}

.banner{display:flex;gap:9px;align-items:flex-start;padding:11px 15px;font-size:12.5px;line-height:1.45;font-weight:600}
.banner.stale{background:#eef1ef;color:#5d6b64}
.banner.warn{background:#fff6e3;color:#6b4e00}
.banner.err{background:#fdeceb;color:#8f2018}

.notice{margin:0 20px 15px;border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.5}
.notice.warn{background:#fff6e3;color:#6b4e00;border:1.5px solid #ffe3a8}
.notice.err{background:#fdeceb;color:#8f2018;border:1.5px solid #f8cdc9}
.notice.info{background:#eef7f1;color:#1d5c39;border:1.5px solid #cfe7d9}
.notice b{display:block;margin-bottom:3px;font-weight:800}

/* ---------- rows / cart ---------- */
.row{display:flex;gap:13px;padding:14px 20px;align-items:center;border-bottom:1.5px solid var(--line)}
.row .rthumb{width:66px;height:66px;border-radius:15px;object-fit:cover;flex:0 0 66px;background:var(--field)}
.row .rname{font-size:14px;font-weight:700;line-height:1.3}
.row .rmeta{font-size:12px;color:var(--muted);margin-top:2px}
.stepper{display:flex;align-items:center;gap:11px;background:var(--field);border-radius:20px;padding:5px 7px}
.stepper button{width:27px;height:27px;border-radius:50%;border:0;background:#fff;color:var(--green);
  font-size:17px;font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1}
.stepper button.plus{background:var(--green);color:#fff}
.stepper span{min-width:15px;text-align:center;font-weight:700;font-size:14px}

.forblock{margin:14px 20px 0;border:1.6px solid var(--line);border-radius:18px;padding:14px 16px}
.forblock .lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.forblock .who{font-size:16px;font-weight:800;margin:4px 0 2px}
.forblock .meta{font-size:12.5px;color:var(--muted);line-height:1.5}
/* Not scoped to .forblock — it is used inline on the OTP and children screens too, and being
   scoped meant those rendered an unstyled default button. */
.change{color:var(--green);font-weight:800;font-size:13px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}

.totals{padding:6px 20px 4px}
.totals .t{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:#42544b}
.totals .t.grand{font-size:17px;font-weight:800;color:var(--ink);border-top:1.5px solid var(--line);
  margin-top:7px;padding-top:12px}
.cutoff{margin:12px 20px;border-radius:14px;padding:11px 14px;font-size:12.5px;font-weight:600;
  background:#eef7f1;color:#1d5c39;line-height:1.45}
.cutoff.soon{background:#fff6e3;color:#6b4e00}
.cutoff.closed{background:#fdeceb;color:#8f2018}

/* ---------- sheet (dish detail) ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,25,18,.45);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;z-index:6;
  max-height:90%;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grabber{width:42px;height:5px;border-radius:3px;background:#d7ded9;margin:11px auto 4px;flex:0 0 auto}
.sheet .inner{overflow-y:auto;padding:8px 20px 4px}
.sheet .hero{width:100%;aspect-ratio:1/.66;border-radius:20px;object-fit:cover;background:var(--field)}

/* ---------- auth ---------- */
.authbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:15px;
  border-radius:30px;border:1.6px solid #d9e2dd;background:#fff;font:inherit;font-size:15px;
  font-weight:700;cursor:pointer;margin-bottom:12px}
.divider{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12.5px;margin:20px 0}
.divider::before,.divider::after{content:'';flex:1;height:1.5px;background:var(--line)}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--green);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:0;background:var(--field);border-radius:15px;
  padding:15px;font:inherit;font-size:14.5px;outline:none;color:var(--ink);font-family:var(--font)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.field .err{font-size:11.5px;color:var(--danger);margin-top:6px;font-weight:600}
.otp{display:flex;gap:9px;justify-content:space-between;margin:6px 0 4px}
.otp div{flex:1;aspect-ratio:1/1.18;background:var(--field);border-radius:14px;display:grid;
  place-items:center;font-size:23px;font-weight:800}
.otp div.filled{background:#e7f5ec;color:var(--green)}
.otp div.next{box-shadow:inset 0 0 0 2px var(--green);background:#fff}
.otp div.next::after{content:'';width:2px;height:26px;background:var(--green);border-radius:2px;
  animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;cursor:pointer}
.check .box{width:23px;height:23px;border-radius:7px;border:2px solid #cbd5cf;flex:0 0 23px;
  display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--green);border-color:var(--green);color:#fff;font-size:14px;font-weight:900}
.check .txt{font-size:13px;line-height:1.5;color:#3c4d45}
.check .txt b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}

.chips{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 6px}
.chip{border:1.6px solid var(--line);background:#fff;border-radius:20px;padding:9px 15px;font:inherit;
  font-size:13px;font-weight:600;cursor:pointer;color:#41544b}
.chip.on{background:var(--pale);border-color:var(--lime);color:var(--deep);font-weight:800}

/* ---------- full-bleed brand screens ---------- */
.brandscreen{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px 34px;color:#fff}
.brandscreen .logo{width:118px;position:relative;margin-bottom:20px}
.brandscreen h1{font-size:27px;font-weight:800;margin:0 0 10px;letter-spacing:-.5px;position:relative}
.brandscreen p{font-size:14.5px;line-height:1.55;opacity:.93;margin:0;position:relative;max-width:290px}
.brandscreen .acts{position:relative;width:100%;margin-top:auto;padding-top:34px}

.timeline{padding:4px 20px 10px}
.tl{display:flex;gap:13px;padding-bottom:20px;position:relative}
.tl::before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:21px;height:21px;border-radius:50%;border:2.5px solid var(--line);background:#fff;
  flex:0 0 21px;z-index:1;display:grid;place-items:center;font-size:11px;color:#fff}
.tl.done .dot{background:var(--green);border-color:var(--green)}
.tl.now .dot{border-color:var(--green);box-shadow:0 0 0 4px #e7f5ec}
.tl .tt{font-size:13.5px;font-weight:700;line-height:1.3}
.tl .ts{font-size:12px;color:var(--muted);margin-top:2px}
.tl.todo .tt{color:var(--muted);font-weight:600}

.code{background:#fff;border:2.5px dashed rgba(255,255,255,.55);border-radius:20px;padding:15px 30px;
  position:relative;margin:22px 0 6px;background:rgba(255,255,255,.14)}
.code .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;opacity:.85;font-weight:700}
.code .num{font-size:38px;font-weight:900;letter-spacing:.14em;margin-top:3px}
.spacer{height:22px}
.tiny{font-size:11.5px;color:var(--muted);line-height:1.5;padding:0 20px 20px}

/* One parent per child in v1 — co-guardians are CUT (decision `AR8`). No read-only child, no
   permission surface, no invite flow. `can_order` stays in the schema defaulted to true. */

  {id:'c3', name:'Kabir',  school:'Alpha Public School',   cls:'7', sec:'A', brk:'Morning break · 10:40', allergens:[],          allergenConsent:true},
];

/* =========================================================================
   Meal packs (E21) — buy N meals up front at a discount.

   Decided 2026-08-26:
   · A pack is N meals, each meal bound by item rules ("2 items, one a drink")
   · Offered per school — a school switch, off by default for schools we don't offer it to
   · Usable for ANY of the parent's children, not tied to one
   · Expires a fixed number of days after purchase
   · No refunds — stated before purchase, not after
   ========================================================================= */
const PACKS = [
  {id:'p10', name:'10 meal pack', meals:10, items:2, mustInclude:'a drink',
   price:300000, alacarte:337500, days:60},
  {id:'p20', name:'20 meal pack', meals:20, items:2, mustInclude:'a drink',

];
/* The days offered when planning. Deliberately includes the four refusals, because a planner
   that only shows bookable days teaches nobody why the others are missing:
   · a day whose cutoff has passed
   · a day the school does not serve
   · a day after the pack expires
   · and, once too many are chosen, running out of meals */
const PLANDAYS = [
  {d:'Wed 27 Aug', brk:'Morning break', why:'cutoff'},
  {d:'Thu 28 Aug', brk:'Morning break'},
  {d:'Fri 29 Aug', brk:'Morning break'},

];

/* =========================================================================
   State. `flags` is what the control rail toggles — every state in the spec
   is reachable deliberately, which is the point of the prototype.
   ========================================================================= */
/* Flags live in one literal so a deep link can RESET to it. Without the reset, loading
   #home,cantconnect and then #menu,bigtext leaves cantconnect set and the second link renders
   the wrong screen — which breaks the exact review workflow deep links exist for. */
const DEFAULT_FLAGS = {
  loading:false, empty:false, error:false, offline:false, signedout:true,
  nochild:false, unpublished:false, cutoff:'open', pricechanged:false,
  pending:false, noallergenconsent:false, cantconnect:false, policy:false,
  bigtext:false,
  /* Meal packs (E21). `packsoff` is the school switch — some schools will not be offered
     packs at all, so "no packs here" is a designed state, not an empty list. */
  packsoff:false, haspack:false, packempty:false, packexpired:false, packineligible:false,
};

const S = {
  screen:'splash', tab:'home', cat:'All', q:'', dish:null, sheet:false,
  child:0, cart:[], otp:'', consent:false, allergenConsent:false,
  confirmAllergen:null,        // the pending "this contains X" confirmation, if any
  note:'', noteWarn:false,     // per-line kitchen note (ux-spec §5.6.1)
  packUse:false, pack:'p10',   // redeeming a pack meal against this cart; the offer being viewed
  plan:{}, planDay:null,       // the multi-day planner: date -> {child, items[]}
  flags:{ ...DEFAULT_FLAGS },
};

const rupees = p => '₹' + (p/100).toFixed(2).replace(/\.00$/,'');
const img = s => DISH_IMAGES[s] || null;
const child = () => CHILDREN[S.child];
const cartCount = () => S.cart.reduce((n,l)=>n+l.q,0);
const subtotal = () => S.cart.reduce((n,l)=>n + l.d.p*l.q, 0);

/* GST per docs/gst-invoicing.md §6.2: each component computed from EACH LINE's taxable value
   and rounded half-up, then summed. Taxing the subtotal instead is a paise adrift on a cart of
   ₹95 + ₹75 — two half-paise that each round up become one that rounds down. Integer only. */
const halfUp = (n,d) => Math.floor((n*2 + d) / (d*2));
function gst(){
  let taxable=0, cgst=0, sgst=0;
  S.cart.forEach(l=>{
    const t = l.d.p * l.q;
    taxable += t;
    cgst += halfUp(t*250, 10000);
    sgst += halfUp(t*250, 10000);
  });
  return { taxable, cgst, sgst, total: taxable+cgst+sgst };
}

/* Is there actually a child whose allergen data we hold? Everything about allergen warnings
   hangs off this, and getting it wrong in either direction is a safety defect:
   claiming a warning we cannot compute, or staying silent about one we can. */
const haveChild = () => !S.flags.signedout && !S.flags.nochild;

/**
 * Allergen collision for the *selected* child — ux-spec F5/F6.
 *
 * Returns `null` when there is **no child selected** (signed out, or signed in with none
 * added). That is not a formality. A warning naming Aarav rendered in the signed-out state is
 * a safety claim manufactured from data that is not there — the same defect class as swallowing
 * a failed allergen fetch into an empty list. Callers that need to explain the *absence* of
 * warnings use `allergenAvailability()` rather than reading a null as "safe".
 */
function clash(d){
  if(!haveChild()) return null;
  const c = child();
  if(!c || !c.allergenConsent || S.flags.noallergenconsent) return null;
  const hit = (d.a||[]).filter(x => c.allergens.includes(x));
  return hit.length ? hit : null;
}

/** Why warnings are or aren't available. Distinguishes "safe" from "we cannot know". */
function allergenAvailability(){
  if(!haveChild()) return {ok:false, why:'no-child'};
  if(!child().allergenConsent || S.flags.noallergenconsent) return {ok:false, why:'no-consent'};
  return {ok:true};
}

/* ---------- small view helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

   light fill: the green pattern, very faint. Green-on-green is invisible — see build.mjs. */

  const src = onGreen ? BRAND.patternDark : BRAND.patternGreen;
  return src ? `<div class="pattern" style="background-image:url(${src});opacity:${onGreen?.3:.12}"></div>` : '';
};
/* The icon alone — the wordmark is set in type beside it where one is wanted. */

};
/* The full lockup, mark and wordmark together, as supplied. Never re-typeset beside itself. */
const lockup = (h=30, white=false) => {

};

  apple:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="flex:0 0 20px"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.2 1.3-2.5 1.3-2.5s-2.5-1-2.5-3.6zM14.2 5.3c.6-.8 1-1.9.9-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 0 2.1-.5 2.8-1.3z"/></svg>'

/* =========================================================================
   Spending a pack — the half that matters.

   Buying is one screen. Using ten meals across a fortnight is where a parent either gets
   value or gives up, so it is a planner rather than ten separate visits to the cart.

   Every refusal is stated on the day it applies to, with the reason, at the moment the
   parent looks at it — not discovered at confirm time.
   ========================================================================= */

/** A meal is valid when it matches the pack's rule exactly. Returns why it doesn't. */
function planValid(items){
  if(!items || !items.length) return {ok:false, why:'Nothing chosen yet'};
  if(items.length < 2)  return {ok:false, why:'Pick one more item'};
  if(items.length > 2)  return {ok:false, why:'A pack meal is two items — remove '+(items.length-2)};
  const hasDrink = items.some(sl => (MENU.find(d=>d.s===sl)||{}).c === 'Drinks');
  if(!hasDrink)         return {ok:false, why:'One of the two must be a drink'};
  return {ok:true};
}
const planCount   = () => Object.keys(S.plan).length;
const planValidCount = () => Object.values(S.plan).filter(v=>planValid(v.items).ok).length;
const mealsLeft   = () => (S.flags.packempty ? 0 : MYPACK.meals - MYPACK.used);
const dayBlocked  = day => {
  if(day.why==='cutoff')    return 'Ordering for this day closed last night';
  if(day.why==='noservice') return 'The school doesn\'t serve on Sundays';
  if(day.why==='expired')   return 'After your pack expires on '+MYPACK.expires;
  return null;
};

/**

 * without an explicit tap: the switch is off until the parent turns it on.
 */
function packStrip(){
  const f = S.flags;

  if(f.haspack && !f.packempty && !f.packexpired){
    const left = MYPACK.meals - MYPACK.used;
    if(f.packineligible) return `
      <div class="packbar no">
        <div style="flex:1">
          <div class="pb-t">This order can't use a pack meal</div>
          <div class="pb-b">A pack meal is two items with one drink. You have three items and no drink.
            Adjust the order, or pay for it as usual — your ${left} meals stay where they are.</div>
        </div>
      </div>`;
    return `
      <div class="packbar">
        <div style="flex:1">
          <div class="pb-t">Pay with a meal from your pack</div>
          <div class="pb-b">${left} of ${MYPACK.meals} left · expires ${MYPACK.expires}${S.packUse?' · this order uses one':''}</div>
        </div>
        <button class="pswitch ${S.packUse?'on':''}" onclick="togglePackUse()" aria-label="Use a pack meal"><i></i></button>
      </div>`;
  }

  if(f.packexpired) return `
    <div class="packbar no">
      <div style="flex:1">
        <div class="pb-t">Your pack expired on ${MYPACK.expires}</div>
        <div class="pb-b">Unused meals are gone and can't be refunded.
          <a href="#" onclick="go('packs');return false" style="color:var(--green);font-weight:700">Buy another pack</a></div>
      </div>
    </div>`;

  if(f.packempty) return `
    <div class="packbar no">
      <div style="flex:1">
        <div class="pb-t">No meals left in your pack</div>
        <div class="pb-b">This order will be charged as usual.
          <a href="#" onclick="go('packs');return false" style="color:var(--green);font-weight:700">Buy another pack</a></div>
      </div>
    </div>`;

  if(f.packsoff) return '';

  return `
    <div class="packbar">
      <div style="flex:1">
        <div class="pb-t">Order like this often?</div>
        <div class="pb-b">A 10 meal pack is ${rupees(300000)} — about ${rupees(30000)} a meal instead of ${rupees(33750)}.
          <a href="#" onclick="go('packs');return false" style="color:var(--green);font-weight:700">See the packs</a></div>
      </div>
    </div>`;
}

function cartRow(l,i){
  const cl = clash(l.d), src = img(l.d.s);
  return `<div class="row">
    ${src?`<img class="rthumb" src="${src}" alt="">`:`<div class="rthumb" ${BRAND.patternGreen?`style="background-image:url(${BRAND.patternGreen});background-size:cover"`:''}></div>`}
    <div style="flex:1">
      <div class="rname">${l.d.n}</div>
      <div class="rmeta">${rupees(l.d.p)} each · excl. GST</div>
      ${cl?`<div style="font-size:11.5px;color:#8f6a00;font-weight:700;margin-top:4px">⚠ Contains ${cl.join(', ')} — ${child().name} is allergic</div>`:''}
      ${l.note?`<div style="font-size:11.5px;color:var(--muted);margin-top:4px">Note: ${esc(l.note)}</div>`:''}
    </div>
    <div class="stepper">
      <button onclick="qty(${i},-1)">−</button><span>${l.q}</span><button class="plus" onclick="qty(${i},1)">+</button>
    </div>
  </div>`;
}

function orderRow(date, who, items, total, status, colour){
  return `<button class="row" style="width:100%;background:#fff;border-left:0;border-right:0;text-align:left;cursor:pointer" onclick="go('orderdetail')">
    <div style="flex:1"><div class="rname">${date} · ${who}</div><div class="rmeta">${items} · ${total}</div></div>
    <div style="font-size:11.5px;font-weight:800;color:${colour}">${status}</div>
  </button>`;
}

function tl(state, title, sub){
  return `<div class="tl ${state}"><div class="dot">${state==='done'?'✓':''}</div>
    <div><div class="tt">${title}</div>${sub?`<div class="ts">${sub}</div>`:''}</div></div>`;
}

function tabbar(){
  const t = (id,label,icon) =>
    `<button class="${S.tab===id?'on':''}" onclick="goTab('${id}')">${icon}<span>${label}</span></button>`;
  return `<div class="tabbar">
    ${t('home','Home',ICON.home)}${t('menu','Menu',ICON.menu)}
    ${t('cart','Cart',ICON.cart)}${t('account','Account',ICON.user)}
  </div>`;
}

/* ---------- the dish sheet ---------- */
function sheet(){
  if(!S.sheet || !S.dish) return '';
  const d = MENU.find(x=>x.s===S.dish); if(!d) return '';
  const cl = clash(d), src = img(d.s), c = child();
  const closed = S.flags.cutoff==='closed';
  const avail = allergenAvailability();

  /* Four cases, and the difference between them is the safety property:
     "this clashes with YOUR child" / "the kitchen declared none" / "the kitchen declared
     these" / "we cannot check for you". The last must never be dressed as the second. */
  const allergenBlock = cl
    ? `<div class="notice warn" style="margin:16px 0 0"><b>⚠ Contains ${cl.join(', ')}</b>
         ${c.name} is allergic to ${cl.join(' and ')}. You can still order it — we'll ask you to confirm first.</div>`
    : !avail.ok
    ? `<div class="notice" style="margin:16px 0 0;background:#f4f6f5;color:#5d6b64;border:1.5px solid var(--line)">
         <b>We can't check this against your child</b>${
           avail.why==='no-child'
             ? 'Choose a child before you order and we\'ll warn you about anything they\'re allergic to.'
             : 'You haven\'t shared allergy details, so we can\'t warn you about ingredients.'
         }${(d.a && d.a.length) ? ` The kitchen declares this dish contains ${d.a.join(', ')}.` : ''}</div>`
    : d.none
    ? `<div class="notice info" style="margin:16px 0 0"><b>No allergens</b>The kitchen has declared this dish free of the allergens we track.</div>`
    : (d.a && d.a.length)
    ? `<div class="notice info" style="margin:16px 0 0"><b>Contains ${d.a.join(', ')}</b>Declared by the kitchen. None of these is one of ${c.name}'s.</div>`
    : `<div class="notice" style="margin:16px 0 0;background:#f4f6f5;color:#5d6b64;border:1.5px solid var(--line)">
         <b>Allergen information not provided</b>The kitchen hasn't told us about this dish either way. That is not the same as "no allergens".</div>`;

  return `<div class="scrim" onclick="closeDish()"></div>
    <div class="sheet"><div class="grabber"></div>
      <div class="inner">
        ${src?`<img class="hero" src="${src}" alt="">`
          :`<div class="hero" ${BRAND.patternGreen?`style="background-image:url(${BRAND.patternGreen});background-size:cover"`:''}></div>`}
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:15px;gap:14px">
          <div><div style="font-size:21px;font-weight:800;letter-spacing:-.3px">${d.n}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
              <span style="position:relative;display:inline-grid;place-items:center;width:18px;height:18px;
                border-radius:4px;border:1.6px solid ${d.v==='egg'?'#c98a00':d.v==='nonveg'?'#a4262c':'#1f8a3d'}">
                <i style="width:8px;height:8px;border-radius:50%;display:block;
                  background:${d.v==='egg'?'#c98a00':d.v==='nonveg'?'#a4262c':'#1f8a3d'}"></i></span>
              <span style="font-size:12.5px;color:var(--muted);font-weight:600">
                ${d.v==='egg'?'Contains egg':d.v==='nonveg'?'Non-vegetarian':'Pure vegetarian'} · ${d.c}</span>
            </div></div>
          <div style="font-size:20px;font-weight:800;color:var(--green);white-space:nowrap">${rupees(d.p)}</div>
        </div>
        ${allergenBlock}
        <div class="forblock" style="margin:16px 0 0">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div><div class="lbl">For</div>
              <div style="font-size:15px;font-weight:800;margin-top:3px">
                ${haveChild()?`${c.name} · Class ${c.cls}-${c.sec}`:'No child chosen yet'}</div>
              <div class="meta">${haveChild()
                ? `${c.school}<br>${c.brk} · Tuesday 12 August`
                : 'You\'ll choose the child and the day when you place the order.'}</div></div>
            ${haveChild()?`<button class="change" onclick="go('children')">Change</button>`:''}
          </div>
        </div>

        <!-- ux-spec §5.6.1: a note is a request to the kitchen, never allergy information. -->
        <div class="field" style="margin:16px 0 0">
          <label>Note for the kitchen <span style="color:var(--muted);font-weight:600">(optional)</span></label>
          <input placeholder="e.g. less spicy, cut into halves" value="${esc(S.note)}"
                 oninput="noteChanged(this.value)">
          <div class="hint">Requests only — the kitchen reads these. <b>Do not put allergies here.</b>
            Allergies go on your child's profile so we can warn you before you order.</div>
          ${S.noteWarn?`<div class="notice warn" style="margin:10px 0 0"><b>That looks like allergy information</b>
            Notes are requests, not a safety record — nobody checks them against the menu. Add it to
            ${haveChild()?esc(c.name)+'’s':'your child’s'} allergy details instead and we'll warn you automatically.
            <div style="margin-top:10px"><button class="btn small" style="width:auto;padding:9px 18px"
              onclick="go('editchild')">Add to allergy details</button></div></div>`:''}
        </div>

        ${closed?`<div class="cutoff closed" style="margin:14px 0 0">Ordering for Tuesday 12 August has closed. Pick another day to add this.</div>`:''}
        <p class="tiny" style="padding:14px 0 0">Price excludes GST. 5% is added at checkout.</p>
      </div>
      <div class="sticky">
        <button class="btn" ${closed?'disabled':''} onclick="requestAdd('${d.s}')">
          ${closed?'Ordering has closed':`Add to cart · ${rupees(d.p)}`}
        </button>
      </div>
    </div>
    ${allergenConfirm()}`;
}

/**
 * The second, deliberate tap — ux-spec §5.6.
 *
 * A confirmation's job cannot be done by a word in a button label. "Add anyway" is one tap, and
 * it is also a reprimand: a parent may have an entirely good reason (a mild intolerance, a dish
 * the kitchen makes differently for them). So the button stays neutral and the decision gets its
 * own surface, naming the child and the allergen.
 */
function allergenConfirm(){
  const s = S.confirmAllergen;
  if(!s) return '';
  const d = MENU.find(x=>x.s===s.dish); if(!d) return '';
  return `<div class="scrim" style="z-index:7" onclick="S.confirmAllergen=null;render()"></div>
    <div class="sheet" style="z-index:8;border-radius:26px;left:18px;right:18px;bottom:auto;top:50%;
         transform:translateY(-50%);max-height:none;animation:none">
      <div class="inner" style="padding:24px 22px 6px">
        <div style="width:46px;height:46px;border-radius:15px;background:#fff6e3;display:grid;
             place-items:center;font-size:23px;margin-bottom:14px">⚠</div>
        <div style="font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.3">
          ${esc(d.n)} contains ${s.allergens.join(' and ')}</div>
        <p style="font-size:14px;color:#42544b;line-height:1.55;margin:10px 0 0">
          ${esc(s.childName)} is allergic to ${s.allergens.join(' and ')}. Add it to this order anyway?</p>
      </div>
      <div class="sticky" style="border-top:0">
        <button class="btn amber" onclick="confirmAdd()">Yes, add it for ${esc(s.childName)}</button>
        <div style="height:10px"></div>
        <button class="btn ghost" onclick="S.confirmAllergen=null;render()">Don't add it</button>
      </div>
    </div>`;
}

/* =========================================================================
   Behaviour
   ========================================================================= */
function render(){
  const f = S.flags;
  const view = f.cantconnect ? V.cantconnect : (V[S.screen] || V.home);
  const green = ['splash','welcome','paying','confirmed'].includes(S.screen) || f.cantconnect;

  const el = document.getElementById('screen');
  el.className = f.bigtext ? 'big' : '';
  el.innerHTML = `
    <div class="statusbar ${green?'on-green':''}"><span>9:41</span><span>􀙇 􀖀 􀛨</span></div>
    ${view()}
    ${sheet()}
    <div class="homebar ${green?'on-green':''}"><i></i></div>`;
  document.getElementById('device').style.background = green ? 'var(--green)' : '#fff';
  renderRail();
  syncHash();
}

function renderRail(){
  const f = S.flags;
  const screens = [
    ['splash','Splash'],['school','Choose school'],['home','Home'],
    ['menu','Menu'],['cart','Cart · review'],['signin','Sign in'],['otp','Email code'],
    ['addchild','Add child'],['editchild','Edit child'],['paying','Confirming payment'],
    ['confirmed','Order placed'],['orders','Orders'],['orderdetail','Order detail'],
    ['children','Your children'],['account','Account'],['policy','Policy gate'],
    ['packs','Meal packs — offers'],['packdetail','Meal packs — one offer'],['mypacks','Meal packs — balance'],
    ['packplan','Packs — plan several days'],['planday','Packs — choose a day\'s items'],['planreview','Packs — review before spending']
  ];
  const cut = [['welcome','Welcome'],['checkout','Checkout review']];
  const toggles = [
    ['loading','Loading (skeletons)'],['empty','Empty'],['error','Error'],['offline','Offline / stale'],
    ['signedout','Signed out'],['nochild','Signed in, no child'],['unpublished','Menu not published'],
    ['pricechanged','Price changed'],['pending','Payment pending'],
    ['noallergenconsent','No allergen consent'],['cantconnect','Can\'t reach backend'],
    ['haspack','Has a meal pack'],['packempty','Pack: none left'],
    ['packexpired','Pack: expired'],['packineligible','Cart can\'t use a pack'],
    ['packsoff','School: packs not offered'],
    ['bigtext','Largest text size (AX5)'],
  ];
  document.getElementById('rail').innerHTML = `
    <h1>GrayBag prototype</h1>
    <p class="sub">Brand from the design package. Screens and states from <b>docs/ux-spec.md</b>.
      Real dish photography from the legacy catalogue.</p>
    <h2>Screens</h2>
    ${screens.map(([id,label])=>`<button class="${S.screen===id&&!f.cantconnect?'on':''}" onclick="go('${id}')">${label}</button>`).join('')}
    <h2>Force a state</h2>
    ${toggles.map(([k,label])=>`<button class="${f[k]?'on':''}" onclick="setFlag('${k}',${!f[k]})">${label}</button>`).join('')}
    <h2>Cutoff</h2>
    ${['open','soon','closed'].map(v=>`<button class="${f.cutoff===v?'on':''}" onclick="setFlag('cutoff','${v}')">${v==='open'?'Open':v==='soon'?'Closing soon':'Closed'}</button>`).join('')}
    <h2>Cart</h2>
    <button onclick="seedCart()">Fill the cart</button>
    <button onclick="S.cart=[];render()">Empty the cart</button>
    <h2>Cut from the flow</h2>
    ${cut.map(([id,label])=>`<button class="${S.screen===id?'on':''}" onclick="go('${id}')">${label}</button>`).join('')}
    <p class="note">Both were removed in ux-spec §6.1.1 — Welcome merged into Choose school,
      Checkout review merged into the cart. 11 screens → 8. They're here only so you can compare
      the merge against what it replaced.</p>
    <p class="note">One child, one service date per order — decided 2026-08-10. That's why there
      is no per-line date anywhere.</p>`;
}

const go     = s => { S.screen = s; S.sheet=false; if(['home','menu','cart','account','orders'].includes(s)) S.tab=s; render(); };
const goTab  = t => { S.tab = t; S.screen = t; S.sheet=false; render(); };
const back   = () => go(S.screen==='signin'?'cart':'home');
const setCat = c => { S.cat = c; render(); };
const clearSearch = () => { S.q=''; S.cat='All'; render(); };
const toggle = k => { S[k] = !S[k]; render(); };
const typeOtp = n => { S.otp = n===''?S.otp.slice(0,-1):(S.otp+n).slice(0,6); render(); };

function setFlag(k,v){
  S.flags[k]=v;
  if(k==='signedout' && v===false) S.flags.nochild=false;
  render();
}
function openPlanDay(d){ S.planDay = d; if(!S.plan[d]) S.plan[d] = {child:S.child, items:[]}; go('planday'); }
function togglePlanItem(d, slug){
  const e = S.plan[d] || (S.plan[d] = {child:S.child, items:[]});
  e.child = S.child;
  const i = e.items.indexOf(slug);
  i>=0 ? e.items.splice(i,1) : e.items.push(slug);
  render();
}
function removePlanDay(d){ delete S.plan[d]; go('packplan'); }
/* Nothing leaves the pack until here. Cancelling one of these later returns its meal. */
function confirmPlan(){
  const n = Object.values(S.plan).filter(v=>planValid(v.items).ok).length;
  MYPACK.used = Math.min(MYPACK.meals, MYPACK.used + n);
  S.plan = {};
  go('confirmed');
}

function openPack(id){ S.pack = id; go('packdetail'); }
/* Buying is the one place a pack is created. Signed-out and no-child gates are the same ones
   ordering uses — a pack is a purchase, so it cannot happen anonymously either. */
function buyPack(){
  if(S.flags.signedout){ go('signin'); return; }
  S.flags.haspack = true; S.flags.packempty = false; S.flags.packexpired = false;
  go('mypacks');
}
/* Explicit, reversible, never automatic. */
function togglePackUse(){ S.packUse = !S.packUse; render(); }

function pickSchool(){ go('home'); }
function pickChild(i){ S.child=i; go('home'); }
function openDish(s){ S.dish=s; S.sheet=true; render(); }
function closeDish(){ S.sheet=false; render(); }

/* Words a parent reaches for when they mean an allergy. Deliberately broad: a false positive
   costs one dismissible prompt, a false negative is allergy information sitting in a free-text
   field nobody has committed to reading. */
const ALLERGY_WORDS = /\b(allerg|anaphyla|intoleran|coeliac|celiac|lactose|gluten|peanut|nut|dairy|milk|egg|soy|sesame|epipen)/i;
function noteChanged(v){
  S.note = v;
  S.noteWarn = ALLERGY_WORDS.test(v);
  render();
}

/** Adding is one tap, unless it collides with the child's allergens — then it is two. */
function requestAdd(s){
  const d = MENU.find(x=>x.s===s);
  const cl = clash(d);
  if(cl){
    S.confirmAllergen = { dish:s, allergens:cl, childName:child().name };
    render();
    return;
  }
  addToCart(s);
}
function confirmAdd(){
  const s = S.confirmAllergen?.dish;
  S.confirmAllergen = null;
  if(s) addToCart(s);
}
function addToCart(s){
  const d = MENU.find(x=>x.s===s);
  const note = S.note.trim();
  // One line per dish+note: "less spicy" on one wrap and not the other are two lines.
  const line = S.cart.find(l=>l.d.s===s && (l.note||'')===note);
  if(line) line.q++; else S.cart.push({d,q:1,note});
  S.sheet=false; S.note=''; S.noteWarn=false; render();
}
function qty(i,delta){
  S.cart[i].q += delta;
  if(S.cart[i].q<=0) S.cart.splice(i,1);
  render();
}
function seedCart(){
  S.cart = [{d:MENU.find(d=>d.s==='paneer-wrap'),q:1},{d:MENU.find(d=>d.s==='fruit-salad'),q:1}];
  render();
}
function placeOrder(){
  if(S.flags.signedout){ go('signin'); return; }      // ux-spec F1 — the one gate
  if(S.flags.policy){ go('policy'); return; }          // F14
  if(S.flags.nochild){ go('addchild'); return; }       // R2
  // No separate Checkout review: with one child and one date the cart already shows the same
  // six facts, so re-confirming them is a step we invented (ux-spec §6.1.1 cut 2).
  go('paying');
}
function verifyOtp(){
  S.flags.signedout=false; S.otp='';
  go(S.flags.nochild?'addchild':'cart');
}
function childAdded(){ S.flags.nochild=false; go('cart'); }
function acceptPolicy(){ S.flags.policy=false; go('checkout'); }
function pay(){ go('paying'); }
function confirmed(){ go('confirmed'); }

/* ---------- deep links ----------
   `#menu`, or `#menu,loading,bigtext` to land on a screen with states already forced. So a
   review comment can point at the exact thing it is about instead of describing how to get
   there. The rail keeps the hash current as you click. */
/** Hash tokens that are not screen names. build.mjs verifies the README against these. */
const HASH_TOKENS = new Set([...Object.keys(DEFAULT_FLAGS), 'signedin', 'cart']);
/** `dish` is a sheet over the menu rather than a screen, so it is valid but not in `V`. */
const HASH_SCREENS = new Set([...Object.keys(V), 'dish']);

function applyHash(){
  const raw = decodeURIComponent(location.hash.replace(/^#/,'')).trim();
  if(!raw) return false;
  const [screen, ...flags] = raw.split(',').map(x=>x.trim()).filter(Boolean);

  // RESET first. A deep link describes a whole state, not a diff against whatever the last one
  // left behind — otherwise the second link a reviewer clicks shows the wrong thing.
  S.flags = { ...DEFAULT_FLAGS };
  S.cart = []; S.sheet = false; S.dish = null; S.q = ''; S.cat = 'All';
  S.otp = ''; S.consent = false; S.allergenConsent = false;
  S.confirmAllergen = null; S.note = ''; S.noteWarn = false; S.packUse = false; S.pack = 'p10'; S.plan = {}; S.planDay = null;

  if(screen && V[screen]) S.screen = screen;
  if(['home','menu','cart','account','orders'].includes(screen)) S.tab = screen;
  flags.forEach(f=>{
    if(f.startsWith('cutoff:')) S.flags.cutoff = f.split(':')[1];
    else if(f==='cart') seedCart();
    else if(f in S.flags) S.flags[f] = true;
  });
  if(flags.includes('signedin')) S.flags.signedout = false;
  // `#dish` is a sheet over the menu, not a screen of its own.
  if(screen === 'dish'){ S.screen = 'menu'; S.tab = 'menu'; S.dish = S.dish || 'mix-veg-poha'; S.sheet = true; }
  /* A planner with nothing in it shows none of the states worth reviewing. */
  if(['packplan','planreview'].includes(screen)){
    S.flags.haspack = true; S.flags.signedout = false;
    S.plan = {
      'Thu 28 Aug':{child:0, items:['paneer-wrap','cold-coffee']},
      'Fri 29 Aug':{child:1, items:['fruit-salad','lemon-ice-tea']},
      'Mon 1 Sep': {child:0, items:['rajma-rice']},          // incomplete on purpose
    };
  }
  return true;
}
function syncHash(){
  const on = Object.entries(S.flags).filter(([k,v])=>v===true).map(([k])=>k);
  if(S.flags.cutoff!=='open') on.push('cutoff:'+S.flags.cutoff);
  history.replaceState(null,'', '#' + [S.screen, ...on].join(','));
}
window.addEventListener('hashchange', ()=>{ if(applyHash()) render(); });

if(applyHash()){
  render();
} else {
  /* Splash holds briefly (spec 5.1), then lands straight on Choose school — Welcome is cut. */
  render();
  setTimeout(()=>{ if(S.screen==='splash') go('school'); }, 1400);
}
</script>
</body>
</html>
