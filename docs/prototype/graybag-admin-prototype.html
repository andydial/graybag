<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrayBag — admin prototype</title>
<style>
/* ==========================================================================
   GrayBag back office — clickable prototype

   The problem this is answering, in Andy's words: "a bad long list of dishes that I scroll
   for long to find a dish, update it, save it and get sent back to the top to do it all over
   again. No searching/sorting. Same dish repeated in each school."

   So the three rules this design is built on:
     1. You never scroll to find something. You search, filter, or sort to it.
     2. Editing never moves you. The list stays exactly where it was.
     3. A dish is ONE thing. It appears once, carrying its menus and prices with it.
   ========================================================================== */
:root{
  --green:#00af52; --deep:#145f48; --amber:#ffbb39; --lime:#b3cf3f; --pale:#e5ea98;
  --ink:#12211a; --muted:#7b8a83; --line:#e6eae8; --field:#f4f6f5; --danger:#c0392b;
  --warn-bg:#fdf7ec; --warn-line:#f0dcae; --ok-bg:#f2f9f4; --ok-line:#cfe6d8;
  --font:'SF Pro Rounded','Nunito',ui-rounded,-apple-system,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);color:var(--ink);background:#0e1512;display:flex;
     justify-content:center;align-items:flex-start;gap:24px;padding:24px 20px 60px}

/* ---------- the state rail, same idea as the parent prototype ---------- */
#rail{width:236px;flex:0 0 236px;color:#cfe0d7;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
#rail h1{font-size:14px;margin:0 0 4px;color:#fff}
#rail p.sub{font-size:11.5px;line-height:1.55;color:#8fa79b;margin:0 0 16px}
#rail h2{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:#6f8a7c;margin:16px 0 6px}
#rail button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#cfe0d7;
  font:inherit;font-size:12.5px;padding:7px 9px;border-radius:9px;cursor:pointer;margin:1px 0}
#rail button:hover{background:#1b2924}
#rail button.on{background:var(--green);color:#fff;font-weight:700}
#rail .note{font-size:10.5px;color:#6f8a7c;line-height:1.55;margin:8px 0 0;padding:0 9px}

/* ---------- the app frame ---------- */
#app{width:1180px;max-width:calc(100vw - 320px);height:calc(100vh - 48px);min-height:680px;
     background:#fff;border-radius:18px;overflow:hidden;display:flex;box-shadow:0 24px 60px rgba(0,0,0,.4)}
#nav{width:212px;flex:0 0 212px;background:var(--deep);color:#dbeae2;padding:18px 12px;display:flex;flex-direction:column}
#nav .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 20px;font-weight:800;color:#fff;font-size:15.5px}
#nav .brand i{width:22px;height:22px;border-radius:7px 7px 3px 3px;background:var(--lime);display:block}
#nav h3{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:#7ea394;margin:16px 8px 6px}
#nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;
  color:#cfe0d7;font:inherit;font-size:13px;padding:8px 9px;border-radius:9px;cursor:pointer;margin:1px 0}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:#fff;color:var(--deep);font-weight:800}
#nav .count{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.16);
  padding:2px 7px;border-radius:99px}
#nav button.on .count{background:var(--pale);color:#4a5a12}
#nav .who{margin-top:auto;font-size:11.5px;color:#9dbdae;padding:12px 9px 0;border-top:1px solid rgba(255,255,255,.12)}

#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:18px 24px 14px;border-bottom:1px solid var(--line)}
.top h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .spacer{flex:1}
#scroll{flex:1;overflow:auto;padding:0 0 40px}

/* ---------- controls ---------- */
.btn{background:var(--green);color:#fff;border:0;border-radius:11px;padding:9px 16px;font:inherit;
  font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--green);filter:none}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.toolbar{position:sticky;top:0;z-index:5;background:#fff;padding:14px 24px 12px;border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--field);border:1.5px solid transparent;
  border-radius:12px;padding:10px 13px}
.search:focus-within{border-color:var(--green);background:#fff}
.search input{flex:1;border:0;background:none;font:inherit;font-size:13.5px;outline:none;color:var(--ink)}
.search svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
select{font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;cursor:pointer}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{background:var(--field);border:1.5px solid transparent;border-radius:99px;padding:6px 13px;font:inherit;
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:#d5ded9}
.chip.on{background:var(--deep);color:#fff}
.chip.warn{color:#8a6400}
.chip.warn.on{background:var(--amber);color:#4a3600}
.chip b{font-weight:800;opacity:.75}
.chip.on b{opacity:.9}

.resultline{font-size:12.5px;color:var(--muted);margin-top:11px;display:flex;align-items:center;gap:8px}
.resultline b{color:var(--ink)}

/* ---------- the workbench table ---------- */
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:#fbfcfb;text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800;z-index:2}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:hover{background:#f8faf9}
tbody tr.sel{background:#f2f9f4}
tbody tr.open{background:#eef7f1;box-shadow:inset 3px 0 0 var(--green)}
td{padding:11px 14px;font-size:13.5px;vertical-align:middle}
td.name{font-weight:700}
td .sub{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.thumb{width:38px;height:38px;border-radius:10px;background:var(--pale);flex:0 0 38px;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.cellflex{display:flex;align-items:center;gap:11px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;
  background:var(--field);color:var(--muted);white-space:nowrap}
.tag.veg{background:#eaf7ee;color:#1b7a3d}
.tag.egg{background:#fdf3e0;color:#8a6400}
.tag.nonveg{background:#fbecea;color:#a83226}
.tag.none{background:var(--warn-bg);color:#8a6400;border:1px dashed var(--warn-line)}
.tag.menu{background:#eef2f6;color:#3f5566}
.tag.live{background:#eaf7ee;color:#1b7a3d}
.tag.draft{background:var(--field);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- bulk bar ---------- */
.bulk{position:sticky;bottom:0;z-index:6;background:var(--deep);color:#fff;display:flex;align-items:center;gap:14px;
  padding:13px 22px;font-size:13px}
.bulk b{font-weight:800}
.bulk .spacer{flex:1}
.bulk button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 13px;
  font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.bulk button:hover{background:rgba(255,255,255,.24)}
.bulk button.go{background:var(--lime);color:#2b3a0c}

/* ---------- drawer ---------- */
#scrim{position:absolute;inset:0;background:rgba(10,20,16,.34);opacity:0;pointer-events:none;transition:opacity .16s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:74%;background:#fff;z-index:21;
  transform:translateX(102%);transition:transform .2s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;
  box-shadow:-18px 0 44px rgba(0,0,0,.16)}
#drawer.on{transform:none}
.dhead{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dhead h3{margin:0;font-size:17px;font-weight:800}
.dhead .sub{font-size:12px;color:var(--muted);margin-top:3px}
.dhead .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.dbody{flex:1;overflow:auto;padding:18px 22px 24px}
.dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.dfoot .spacer{flex:1}
.dfoot .hint{font-size:11.5px;color:var(--muted)}

.field{margin:0 0 15px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  font-weight:800;margin:0 0 6px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;font:inherit;font-size:13.5px;
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.field textarea{min-height:64px;resize:vertical;line-height:1.6}
.field .help{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.two{display:flex;gap:12px}
.two > *{flex:1}

.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--field);border:1.5px solid transparent;border-radius:10px;padding:9px;font:inherit;
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--deep);color:#fff}
.seg button.on.veg{background:#1b7a3d}
.seg button.on.egg{background:#b8860b}
.seg button.on.nonveg{background:#a83226}

.checks{display:flex;flex-wrap:wrap;gap:7px}
.checks label{display:flex;align-items:center;gap:7px;background:var(--field);border:1.5px solid transparent;
  border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.checks label.on{background:#eaf7ee;border-color:#bfe3cc;color:#1b7a3d}

.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;
  margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}

.menurow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.menurow:last-child{border-bottom:0}
.menurow .m{flex:1;font-size:13px;font-weight:700}
.menurow .m span{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.menurow input{width:96px;text-align:right}

.switch{flex:0 0 42px;width:42px;height:25px;border-radius:99px;border:0;background:#cfd8d3;position:relative;cursor:pointer}
.switch.on{background:var(--green)}
.switch i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .16s}
.switch.on i{left:20px}

/* ---------- cards / panels ---------- */
.pad{padding:20px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1.5px solid var(--line);border-radius:16px;padding:16px 17px;background:#fff}
.card h4{margin:0 0 4px;font-size:14.5px;font-weight:800}
.card .k{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0 2px}
.card .m{font-size:12px;color:var(--muted);line-height:1.55}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.ok{background:var(--ok-bg);border-color:var(--ok-line)}

.gate{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.gate:last-child{border-bottom:0}
.gate .ic{flex:0 0 20px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.gate.pass .ic{background:var(--green)}
.gate.fail .ic{background:var(--danger)}
.gate.warn .ic{background:var(--amber);color:#4a3600}
.gate .t{flex:1;font-size:13.5px;font-weight:700}
.gate .t span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.55}

.notice{border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.6;margin:0 0 16px}
.notice b{display:block;font-size:13.5px;margin-bottom:3px}
.notice.warn{background:var(--warn-bg);border:1.5px solid var(--warn-line);color:#6b4e00}
.notice.err{background:#fbecea;border:1.5px solid #f0c8c2;color:#8f271c}
.notice.info{background:var(--ok-bg);border:1.5px solid var(--ok-line);color:#1b5a38}

.empty{text-align:center;padding:64px 30px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin:0 0 7px}
.empty p{font-size:13px;line-height:1.65;max-width:400px;margin:0 auto 18px}

.sk{background:linear-gradient(90deg,#eef1ef 25%,#f7f9f8 37%,#eef1ef 63%);background-size:400% 100%;
  animation:sh 1.3s infinite;border-radius:9px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

.funnel{display:flex;flex-direction:column;gap:2px}
.fstep{display:flex;align-items:center;gap:14px;padding:12px 0}
.fbar{height:34px;border-radius:9px;background:var(--deep);min-width:44px;display:flex;align-items:center;
  padding:0 12px;color:#fff;font-weight:800;font-size:14px}
.fstep .lbl{flex:0 0 190px;font-size:13.5px;font-weight:700}
.fstep .drop{font-size:12px;color:#8a6400;background:var(--warn-bg);border:1px solid var(--warn-line);
  padding:4px 10px;border-radius:99px;font-weight:700}
</style>
</head>
<body>
<div id="rail"></div>
<div id="app">
  <div id="nav"></div>
  <div id="main">
    <div id="chrome"></div>
    <div id="scroll"></div>
    <div id="scrim" onclick="closeDrawer()"></div>
    <div id="drawer"></div>
  </div>
</div>

<script>
/* =========================================================================
   Fixtures. Names and shapes are the real ones; numbers are plausible, not live.
   ========================================================================= */
const SCHOOLS = [

/* A dish is ONE record. `menus` is where it appears and at what price — the thing the old
   screen expressed by repeating the whole dish once per school. */
const DISHES = [

const PACKS = [
  {id:'p10', name:'10 meal pack', meals:10, items:2, must:'Drinks', price:300000, days:60,
   schools:['amity','paragon'], live:true,  sold:14},
  {id:'p20', name:'20 meal pack', meals:20, items:2, must:'Drinks', price:560000, days:90,
   schools:['amity'],           live:true,  sold:3},
  {id:'p5',  name:'5 meal starter', meals:5, items:2, must:'',      price:160000, days:30,
   schools:[],                  live:false, sold:0},
];

const DAYS = ['Mon 24 Aug','Tue 25 Aug','Wed 26 Aug','Thu 27 Aug','Fri 28 Aug'];
const ORDERS = [
  {code:'GB-4K2M9P', child:'Aarav',  cls:'6-B', school:'amity',   brk:'Morning break', day:'Wed 26 Aug',
   lines:[['Paneer Wrap',1,9500],['Cold Coffee',1,10900]], total:26042, pack:false, state:'paid',
   parent:'anuragdial@gmail.com', allergens:['milk'], placed:'25 Aug, 21:14', invoice:'GB/26-27/000001'},
  {code:'GB-9XT4LM', child:'Ishita', cls:'4-A', school:'amity',   brk:'Morning break', day:'Wed 26 Aug',
   lines:[['Fruit Salad',1,7900],['Lemon Ice Tea',1,10900]], total:0, pack:true, state:'paid',
   parent:'priya.sharma@gmail.com', allergens:[], placed:'25 Aug, 22:02', invoice:'—', packRef:'10 meal pack · 6 left'},
  {code:'GB-QW83ZR', child:'Kabir',  cls:'7-A', school:'paragon', brk:'Second break',  day:'Tue 25 Aug',
   lines:[['Rajma With Rice',1,11500],['Chocolate Muffin',1,8500],['Cold Coffee',1,10900]], total:31890,
   pack:false, state:'delivered', parent:'r.mehta84@yahoo.in', allergens:['gluten','milk'],
   placed:'24 Aug, 19:47', invoice:'GB/26-27/000002'},
];

/* Named menus. A menu is a THING with a name, not an anonymous list bolted to a school —
   which is what lets you start a new school from a menu that already works. */
const MENUS = [
  {id:'m1', name:'Sky Bites',            note:'Amity\'s full range',        dishes:47, schools:['amity']},
  {id:'m2', name:'School Menu — Aug 2026', note:'Shared starter menu',        dishes:36, schools:['paragon','gem']},
  {id:'m3', name:'Summer light',         note:'Draft — not assigned',        dishes:18, schools:[]},
];

/* =========================================================================
   State
   ========================================================================= */
const DEFAULTS = {
  loading:false, empty:false, error:false,   // list states
  nopacks:false,                              // packs never configured
};
const S = {
  page:'dishes', q:'', filter:'all', sort:'name', sel:new Set(), range:'30d', rSchool:'all', pq:'', day:'Wed 26 Aug', oSchool:'all', oState:'all', oGroup:'class',
  drawer:null, drawerKind:null, school:'amity', dirty:false,
  flags:{...DEFAULTS},
};

const rupees = p => '₹' + (p/100).toFixed(2).replace(/\.00$/,'');
const esc = s => String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const school = id => SCHOOLS.find(s=>s.id===id);
const priceRange = d => {
  const v = Object.values(d.m);
  if(!v.length) return '—';
  const lo=Math.min(...v), hi=Math.max(...v);
  return lo===hi ? rupees(lo) : rupees(lo)+'–'+rupees(hi);
};
/* A dish "needs attention" if it can't be safely published: no food type is the blocking one,
   because a parent cannot tell whether it is vegetarian. */
const needsAttention = d => !d.t || !d.photo || (Object.keys(d.m).length===0);
const blocking = d => !d.t && Object.keys(d.m).length>0;

const ICON = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
};

/* ---------------------------------------------------------------- Dishes: the workbench */
P.dishes = () => {
  const f = S.flags;
  const counts = {
    all: DISHES.length,
    notype: DISHES.filter(d=>!d.t).length,
    nomenu: DISHES.filter(d=>!Object.keys(d.m).length).length,
    nophoto: DISHES.filter(d=>!d.photo).length,
    egg: DISHES.filter(d=>d.t==='egg').length,
  };

  let list = DISHES.filter(d=>{
    if(S.q && !d.n.toLowerCase().includes(S.q.toLowerCase()) && !d.c.toLowerCase().includes(S.q.toLowerCase())) return false;
    if(S.filter==='notype')  return !d.t;
    if(S.filter==='nomenu')  return !Object.keys(d.m).length;
    if(S.filter==='nophoto') return !d.photo;
    if(S.filter==='egg')     return d.t==='egg';
    if(CATS.includes(S.filter)) return d.c===S.filter;
    return true;
  });

  /* Rank matches so typing "pan" puts Pancakes above the seven Paneer dishes — a list that
     merely *contains* your word is still a list you have to read. */
  if(S.q){
    const q = S.q.toLowerCase();
    list = list.slice().sort((a,b)=>{
      const ai = a.n.toLowerCase().startsWith(q)?0:1, bi = b.n.toLowerCase().startsWith(q)?0:1;
      return ai-bi || a.n.localeCompare(b.n);
    });
  } else if(S.sort==='name')      list = list.slice().sort((a,b)=>a.n.localeCompare(b.n));
  else if(S.sort==='attention')   list = list.slice().sort((a,b)=>(needsAttention(b)?1:0)-(needsAttention(a)?1:0) || a.n.localeCompare(b.n));
  else if(S.sort==='category')    list = list.slice().sort((a,b)=>a.c.localeCompare(b.c) || a.n.localeCompare(b.n));
  else if(S.sort==='menus')       list = list.slice().sort((a,b)=>Object.keys(b.m).length-Object.keys(a.m).length || a.n.localeCompare(b.n));

  const chip = (id,label,n,warn) =>
    `<button class="chip ${warn?'warn':''} ${S.filter===id?'on':''}" onclick="setFilter('${id}')">${label}${n!=null?` <b>${n}</b>`:''}</button>`;

  const toolbar = `
    <div class="toolbar">
      <div class="searchrow">
        <div class="search">${ICON.search}
          <input placeholder="Search dishes — name or category" value="${esc(S.q)}" oninput="setQ(this.value)" autocomplete="off">
        </div>
        <select onchange="S.sort=this.value;render()">
          <option value="name"      ${S.sort==='name'?'selected':''}>Sort: A–Z</option>
          <option value="attention" ${S.sort==='attention'?'selected':''}>Sort: needs attention first</option>
          <option value="category"  ${S.sort==='category'?'selected':''}>Sort: category</option>
          <option value="menus"     ${S.sort==='menus'?'selected':''}>Sort: most menus</option>
        </select>
        <button class="btn" onclick="openDish(null)">New dish</button>
      </div>
      <div class="chips">
        ${chip('all','All',counts.all)}
        ${chip('notype','Needs a food type',counts.notype,true)}
        ${chip('nomenu','Not on any menu',counts.nomenu,true)}
        ${chip('nophoto','No photo',counts.nophoto,true)}
        ${chip('egg','Egg',counts.egg)}
        ${CATS.map(c=>chip(c,c,DISHES.filter(d=>d.c===c).length)).join('')}
      </div>
      <div class="resultline">
        <b>${list.length}</b> of ${DISHES.length} dishes
        ${S.q?`matching "${esc(S.q)}"`:''}
        ${S.filter!=='all'?` · filtered`:''}
        ${list.some(needsAttention)?` · <span style="color:#8a6400;font-weight:700">${list.filter(needsAttention).length} need attention</span>`:''}
      </div>
    </div>`;

  if(f.loading) return {title:'Dishes', sub:'Every dish, once', body: toolbar + `<div class="pad">${
    Array.from({length:8},()=>'<div class="sk" style="height:56px;margin-bottom:8px"></div>').join('')}</div>`};

  if(f.error) return {title:'Dishes', sub:'Every dish, once', body: toolbar + `<div class="pad">
    <div class="notice err"><b>We couldn't load the catalogue</b>
      Nothing has changed. Try again — and if it keeps failing, the daily digest will have caught it too.</div>
    <button class="btn" onclick="setFlag('error',false)">Try again</button></div>`};

  if(!list.length) return {title:'Dishes', sub:'Every dish, once', body: toolbar + `<div class="empty">
    <h3>Nothing matches</h3>
    <p>${S.q?`No dish is called “${esc(S.q)}”.`:'No dish is in that state — which is usually good news.'}</p>
    <button class="btn ghost" onclick="clearFilters()">Clear search and filters</button></div>`};

  const rows = list.map(d=>`
    <tr class="${S.sel.has(d.id)?'sel':''} ${S.drawer===d.id?'open':''}" onclick="openDish('${d.id}')">
      <td style="width:38px" onclick="event.stopPropagation()">
        <input type="checkbox" ${S.sel.has(d.id)?'checked':''} onchange="toggleSel('${d.id}')"></td>
      <td class="name">
        <div class="cellflex">
          <div class="thumb">${d.photo?'🍽':'<span style="opacity:.5;font-size:11px">no<br>photo</span>'}</div>
          <div>${d.n}<div class="sub">${d.c}${d.kcal?' · '+d.kcal+' kcal':''}</div></div>
        </div></td>
      <td>${d.t
        ? `<span class="tag ${d.t}"><span class="dot"></span>${d.t==='nonveg'?'Non-veg':d.t[0].toUpperCase()+d.t.slice(1)}</span>`
        : `<span class="tag none">not set</span>`}</td>
      <td>${d.a.length?d.a.map(a=>`<span class="tag" style="margin-right:4px">${a}</span>`).join(''):'<span style="color:var(--muted)">—</span>'}</td>
      <td>${Object.keys(d.m).length
        ? Object.keys(d.m).map(k=>`<span class="tag menu" style="margin-right:4px">${school(k).name.split(' ')[0]}</span>`).join('')
        : '<span class="tag none">on no menu</span>'}</td>
      <td style="font-weight:700;white-space:nowrap">${priceRange(d)}</td>
    </tr>`).join('');

  return {
    title:'Dishes', sub:'Every dish once, carrying the menus it is on',
    body: toolbar + `
      <table>
        <thead><tr>
          <th style="width:38px"><input type="checkbox" ${S.sel.size===list.length&&list.length?'checked':''}
            onchange="selectAll(${JSON.stringify(list.map(d=>d.id)).replace(/"/g,'&quot;')})"></th>
          <th>Dish</th><th>Food type</th><th>Allergens</th><th>On menus</th><th>Price</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${S.sel.size?bulkBar(list):''}`
  };
};

function bulkBar(list){
  const chosen = DISHES.filter(d=>S.sel.has(d.id));
  const noType = chosen.filter(d=>!d.t).length;
  return `<div class="bulk">
    <b>${S.sel.size} selected</b>
    ${noType?`<span style="opacity:.8">${noType} with no food type</span>`:''}
    <div class="spacer"></div>
    <button class="go" onclick="bulkType('veg')">Set Veg</button>
    <button onclick="bulkType('egg')">Set Egg</button>
    <button onclick="bulkType('nonveg')">Set Non-veg</button>
    <button onclick="S.sel=new Set();render()">Clear</button>
  </div>`;
}

/* ----------------------------------------------------------------
   Orders — the day, not a dump.

   Everything the kitchen board already gave you stays: move between days, filter by school
   and status, group by class or by dish. What it adds is the detail — open an order and see
   its lines, who placed it, what was paid and how.
   ---------------------------------------------------------------- */
P.orders = () => {
  const di = DAYS.indexOf(S.day);
  let list = ORDERS.filter(o=>
    (S.oSchool==='all' || o.school===S.oSchool) &&
    (S.oState==='all'  || o.state===S.oState) &&
    o.day===S.day);

  const groups = {};
  if(S.oGroup==='class'){
    list.forEach(o=>{ const k = o.cls+' · '+school(o.school).name+' · '+o.brk;
      (groups[k] ||= []).push(o); });
  } else {
    list.forEach(o=>o.lines.forEach(([n,q])=>{ (groups[n] ||= []).push({...o, qty:q}); }));
  }

  const chip = (k,cur,val,label) => `<button class="chip ${cur===val?'on':''}" onclick="S.${k}='${val}';render()">${label}</button>`;

  return {
    title:'Orders', sub:'Move between days · filter · open one for the detail',
    body:`
      <div class="toolbar">
        <div class="searchrow">
          <button class="btn ghost sm" ${di<=0?'disabled':''} onclick="S.day='${DAYS[Math.max(0,di-1)]}';render()">‹</button>
          <div style="min-width:190px">
            <div style="font-size:16px;font-weight:800">${S.day}</div>

   your scroll position or your filters. Close the drawer and you are exactly where you were.

function openDish(id){ S.drawer=id||'new'; S.drawerKind='dish'; S.dirty=false; render(); }
function openPack(id){ S.drawer=id||'newpack'; S.drawerKind='pack'; S.dirty=false; render(); }
function closeDrawer(){ S.drawer=null; S.drawerKind=null; S.dirty=false; render(); }

function renderDrawer(){
  const el = document.getElementById('drawer'), scrim = document.getElementById('scrim');
  if(!S.drawer){ el.className=''; scrim.className=''; el.innerHTML=''; return; }
  el.className='on'; scrim.className='on';
  el.innerHTML = S.drawerKind==='dish' ? dishDrawer() : S.drawerKind==='order' ? orderDrawer() : packDrawer();
}

          <button class="switch ${on?'on':''}" onclick="toggleMenu('${d.id}','${s.id}')"><i></i></button>
          <div class="m">${s.name}<span>${s.menu}</span></div>
          ${on?`<input type="text" value="${rupees(d.m[s.id])}" oninput="S.dirty=true">`
              :`<span style="font-size:12px;color:var(--muted)">not on this menu</span>`}
        </div>`;
      }).join('')}
      <div class="help" style="margin-top:10px">Price is per menu, because the same dish is not the
        same price at every school. This is what the old screen was trying to say by listing the
        dish three times.</div>
    </div>
    <div class="dfoot">
      <button class="btn" onclick="saveDrawer()">Save</button>
      <button class="btn ghost" onclick="closeDrawer()">Cancel</button>
      <div class="spacer"></div>
      <div class="hint">Saving keeps you here</div>
    </div>`;
}

function packDrawer(){
  const isNew = S.drawer==='newpack';
  const p = isNew
    ? {id:'newpack',name:'',meals:10,items:2,must:'Drinks',price:300000,days:60,schools:[],live:false,sold:0}
    : PACKS.find(x=>x.id===S.drawer);
  const per = p.meals?Math.round(p.price/p.meals):0;

  return `
    <div class="dhead">
      <div><h3>${isNew?'New meal pack':esc(p.name)}</h3>
        <div class="sub">${p.sold?p.sold+' sold · '+(p.sold*p.meals)+' meals outstanding':'Never sold'}</div></div>
      <button class="x" onclick="closeDrawer()">×</button>
    </div>
    <div class="dbody">
      ${p.sold?`<div class="notice warn"><b>${p.sold} parents already hold this pack</b>
        Changing the rules or the meal count does not change packs already bought — those keep the
        terms they were sold under. Edits here apply to new purchases only.</div>`:''}

      <div class="sec">What it is</div>
      <div class="field"><label>Name parents see</label>
        <input type="text" value="${esc(p.name)}" placeholder="e.g. 10 meal pack" oninput="S.dirty=true"></div>
      <div class="two">
        <div class="field"><label>Meals in the pack</label>
          <input type="number" value="${p.meals}" oninput="S.dirty=true"></div>
        <div class="field"><label>Price</label>
          <input type="text" value="${rupees(p.price)}" oninput="S.dirty=true">
          <div class="help">${rupees(per)} a meal</div></div>
      </div>

      <div class="sec">What one meal buys</div>
      <div class="two">
        <div class="field"><label>Items per meal</label>
          <input type="number" value="${p.items}" oninput="S.dirty=true"></div>
        <div class="field"><label>One item must be from</label>
          <select onchange="S.dirty=true">
            <option value="">Any category</option>
            ${CATS.map(c=>`<option ${p.must===c?'selected':''}>${c}</option>`).join('')}
          </select></div>
      </div>
      <div class="help" style="margin:-6px 0 16px">
        A parent's cart qualifies when it matches exactly this. When it doesn't, the app says what
        would fix it rather than just refusing.</div>

      <div class="sec">How long it lasts</div>
      <div class="field"><label>Valid for</label>
        <input type="number" value="${p.days}" oninput="S.dirty=true">
        <div class="help">Days from purchase. Unused meals expire and are <b>not refundable</b> —
          the app states both before the parent pays.</div></div>

      <div class="sec">Where it's offered</div>
      ${SCHOOLS.map(s=>`<div class="menurow">
        <button class="switch ${p.schools.includes(s.id)?'on':''}" onclick="togglePackSchool('${p.id}','${s.id}')"><i></i></button>
        <div class="m">${s.name}<span>${s.packs?'Packs are on at this school':'Packs are off at this school — turn them on there first'}</span></div>
      </div>`).join('')}

      <div class="sec">Status</div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="flex:1"><div style="font-size:13.5px;font-weight:700">${p.live?'Live — parents can buy this':'Draft — nobody can see it'}</div>
          <div class="help">A draft can be edited freely. Once it's live and sold, the terms are fixed for those buyers.</div></div>
        <button class="switch ${p.live?'on':''}" onclick="togglePackLive('${p.id}')"><i></i></button>
      </div>
    </div>
    <div class="dfoot">
      <button class="btn" onclick="saveDrawer()">Save</button>
      <button class="btn ghost" onclick="closeDrawer()">Cancel</button>
      <div class="spacer"></div>
      <div class="hint">Saving keeps you here</div>
    </div>`;
}

/* =========================================================================
   Actions
   ========================================================================= */
function setQ(v){ S.q=v; render(true); }
function setFilter(f){ S.filter = S.filter===f?'all':f; S.sel=new Set(); render(); }
function clearFilters(){ S.q=''; S.filter='all'; render(); }
function jumpNoType(){ S.page='dishes'; S.filter='notype'; S.q=''; render(); }
function toggleSel(id){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); }
function selectAll(ids){ if(S.sel.size===ids.length) S.sel=new Set(); else S.sel=new Set(ids); render(); }
function bulkType(t){ DISHES.forEach(d=>{ if(S.sel.has(d.id)) d.t=t; }); S.sel=new Set(); render(); }
function setType(id,t){ const d=DISHES.find(x=>x.id===id); if(d){ d.t=t; render(); } }
function toggleAllergen(id,a){
  const d=DISHES.find(x=>x.id===id); if(!d) return;
  d.a.includes(a) ? d.a.splice(d.a.indexOf(a),1) : d.a.push(a);
  render();
}
function toggleMenu(id,s){
  const d=DISHES.find(x=>x.id===id); if(!d) return;
  if(d.m[s]!=null) delete d.m[s]; else d.m[s]=9900;
  render();
}
function togglePacks(id){ const s=school(id); s.packs=!s.packs; render(); }
function togglePackSchool(pid,sid){
  const p=PACKS.find(x=>x.id===pid); if(!p) return;
  p.schools.includes(sid) ? p.schools.splice(p.schools.indexOf(sid),1) : p.schools.push(sid);
  render();
}
function togglePackLive(pid){ const p=PACKS.find(x=>x.id===pid); if(p){ p.live=!p.live; render(); } }
function saveDrawer(){ S.dirty=false; render(); }
function setFlag(k,v){ S.flags[k]=v; render(); }

/* =========================================================================
   Render. The list and the drawer are rendered separately so opening, editing and
   closing the drawer never re-renders — and therefore never re-scrolls — the list.
   ========================================================================= */
let lastPage=null, lastKey=null;
function render(keepFocus){
  renderNav(); renderRail();

  const page = P[S.page]();
  document.getElementById('chrome').innerHTML = `
    <div class="top">
      <div><h2>${page.title}</h2><div class="sub">${page.sub}</div></div>
      <div class="spacer"></div>
    </div>`;

  const scroll = document.getElementById('scroll');
  const y = scroll.scrollTop;
  const active = document.activeElement;
  const wasSearch = active && active.tagName==='INPUT' && active.type!=='checkbox' && scroll.contains(active);
  const caret = wasSearch ? active.selectionStart : null;

  scroll.innerHTML = page.body;

  // Editing must not move you. Restore scroll always; restore the caret when you were typing.
  scroll.scrollTop = (lastPage===S.page) ? y : 0;
  lastPage = S.page;
  if(keepFocus && wasSearch){
    const input = scroll.querySelector('.search input');
    if(input){ input.focus(); if(caret!=null) input.setSelectionRange(caret,caret); }
  }

  renderDrawer();
}

function renderRail(){
  const f=S.flags;
  const pages = NAV.map(([id,label])=>[id,label]);
  document.getElementById('rail').innerHTML = `
    <h1>GrayBag back office</h1>
    <p class="sub">A prototype of the admin, rebuilt around three rules: you never scroll to find
      something, editing never moves you, and a dish is one thing.</p>
    <h2>Screens</h2>
    ${pages.map(([id,label])=>`<button class="${S.page===id?'on':''}" onclick="go('${id}')">${label}</button>`).join('')}
    <h2>Force a state</h2>
    ${[['loading','Loading'],['error','Failed to load'],['nopacks','No packs configured']]
      .map(([k,l])=>`<button class="${f[k]?'on':''}" onclick="setFlag('${k}',${!f[k]})">${l}</button>`).join('')}
    <h2>Try this</h2>
    <button onclick="jumpNoType()">The 3 dishes with no food type</button>
    <button onclick="S.page='dishes';S.q='pan';render()">Search “pan” — ranked</button>
    <button onclick="S.page='dishes';S.filter='all';S.q='';S.sel=new Set(DISHES.filter(d=>!d.t).map(d=>d.id));render()">Select every unmarked dish</button>
    <button onclick="S.page='packs';openPack('p10')">A pack that people already bought</button>
    <button onclick="S.page='schools';S.school='gem';render()">A school that can't take orders</button>
    <button onclick="S.page='reports';render()">Reports over a date range</button>
    <button onclick="S.page='people';S.pq='graybag.com';render()">Search accounts by email</button>
    <button onclick="S.page='menus';render()">Reuse a menu at a new school</button>
    <button onclick="S.page='orders';render()">A day of orders, grouped by class</button>
    <button onclick="S.page='orders';S.oGroup='dish';render()">The same day, grouped by dish</button>
    <button onclick="S.page='orders';openOrder('GB-9XT4LM')">An order paid with a pack meal</button>
    <p class="note">Open a dish, change something, close it. The list is exactly where you left it —
      same scroll, same filters, same search.</p>`;
}

render();
</script>
</body>
</html>
