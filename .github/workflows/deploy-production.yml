name: Deploy to production

# A tagged release, and only a tagged release, reaches production — and only after a
# human approves it.
#
# The approval is not in this file. It is the `production` GitHub Environment's
# required-reviewer rule, which pauses the job before ANY step runs and, crucially,
# before the secrets scoped to that environment are made available. A gate written as
# a workflow step could be edited away in the same PR it is meant to guard; an
# environment rule is repository configuration and cannot be.
#
# Set up by scripts/setup-github.mjs. Verify with:
#   gh api repos/andydial/graybag/environments/production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # `E17-63`. This job exists to make one specific failure legible, and it deliberately has
  # NO `environment:` key — that is the whole point of it.
  #
  # The `production` environment's `deployment_branch_policy` admits tags matching `v*` and
  # nothing else. So dispatching this workflow from a BRANCH is refused by GitHub at the
  # environment gate, before the runner starts: the run appears, fails in about a second,
  # records **zero steps**, and writes no logs at all. There is nothing to click into and
  # nothing to read. On 2026-08-25 that run was reported as "failed on the Migrations job",
  # which is the natural reading and is wrong — the Migrations job never began.
  #
  # A job with no environment is not gated, so this one always runs and always leaves a
  # message. The cost of the trap was three days of migrations and nine Edge Functions
  # sitting unapplied while the deploy looked attempted.
  #
  # Note `workflow_dispatch` is kept, because it is legitimately useful — dispatched
  # against a TAG (`--ref v2026.08.28`), which the branch policy admits. Tags are dated
  # rather than semver so they are never mistaken for the mobile app's version (`DP7`).
  preflight:
    name: Check the ref can deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a ref production will not accept
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Production deploys run from a TAG, not from '${{ github.ref_name }}'."
          echo ""
          echo "The 'production' environment admits only refs matching v* of type tag."
          echo "A run from a branch is rejected at the environment gate before any step"
          echo "runs, which is why such a run shows no logs and no steps."
          echo ""
          echo "To deploy:      git tag v2026.08.28 && git push origin v2026.08.28   # DP7: dated, not semver"
          echo "To re-run one:  gh workflow run deploy-production.yml --ref v2026.08.28"
          exit 1

      - name: Ref accepted
        run: echo "Deploying from tag ${{ github.ref_name }}."

  database:
    # Named for both halves deliberately. It was called "Migrations", and the Edge Function
    # deployment at the bottom of it is invisible under that name — so "the Migrations job
    # failed" reads as a database problem when what actually did not happen was also nine
    # function deployments.
    name: Migrations and Edge Functions
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Scoped to the `production` environment (`E17-64`), so it resolves to PRODUCTION's password
      # here and staging's everywhere else, under one name. See the guard below for why that
      # scoping is the security property and not just tidiness.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Hardcoded, exactly as staging hardcodes its own — `E17-68`.
      #
      # A project ref is not a secret: it is in every Supabase URL the app ships with, and in the
      # anon key. Keeping it in a secret bought nothing and cost the one thing that mattered —
      # you could not tell by reading this file which database it deploys to. It is also how the
      # workflow came to fail its own credential guard, because a secret that nobody can see is
      # missing is a secret nobody notices was never created.
      SUPABASE_PROJECT_REF: bdamkuugbqjajbndjoxn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Production deploys run the full smoke test rather than trusting that the tagged
      # commit was green on main. A tag can be moved, and it can be cut from a commit
      # that never had a CI run of its own.
      - name: Smoke test
        run: npm run smoke

      # The guard that stops the empty-string failure mode that cost staging three days — see
      # deploy-staging.yml for the story. It now checks two names rather than three, because the
      # third is above in plain sight and cannot be absent.
      #
      # `SUPABASE_DB_PASSWORD` stays a SECRET and stays SCOPED to this environment, which is the
      # half that is not merely convention: a repository-level secret is readable by any workflow
      # in the repo, including one added in a pull request, without ever passing the
      # required-reviewer gate. An environment-scoped one is not. The ref is public information;
      # the production database password is the thing the gate exists to protect.
      - name: Check the deploy credentials are present
        run: |
          missing=""
          [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Cannot deploy to PRODUCTION — missing:$missing"
            echo "::error::Both are scoped to the 'production' GitHub Environment, not the"
            echo "::error::repository. Set them with: npm run secrets:set -- production"
            exit 1
          fi

      # Deploying to the ref printed here, from the env above, so the log names the target.
      - name: Link the production project
        run: |
          echo "Deploying to project $SUPABASE_PROJECT_REF"
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Printed before anything is applied, so the approver's decision and the actual
      # change are both in one log.
      - name: Pending migrations
        run: npx supabase migration list --linked

      - name: Apply migrations
        run: npx supabase db push --include-all

      - name: Deploy Edge Functions
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then
            npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "No Edge Functions yet — skipping. They arrive with E06."
          fi
