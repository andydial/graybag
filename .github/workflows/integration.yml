name: Integration

# Everything that needs a real Postgres: the migrations replaying from 0001, the seed
# data loading, and the pgTAP authorization suite.
#
# NOT on every push. CLAUDE.md's testing rhythm puts a ~60s smoke test on every push
# and the full suite overnight, because a Supabase stack takes minutes to come up and
# paying that on every commit is how people start skipping CI. So this runs:
#
#   * nightly, alongside scripts/nightly.sh;
#   * on any PR, but doing real work only when that PR touches the schema, the seed
#     data or this workflow — a change there is exactly the change the smoke test
#     cannot judge. See the trigger note below for why the filter is not on `paths:`;
#   * on demand.
#
# The suite CANNOT run against a bare postgres:16 image. `app_user.id` is a foreign key
# to `auth.users(id)` and impersonation reads auth.uid() from request.jwt.claims, so the
# GoTrue auth schema must exist — which means the real Supabase local stack.
# docs/testing-strategy.md §6.

# NOTE ON THE TRIGGER — this workflow is a REQUIRED status check (E01-02 ruleset),
# and that is why there is no `paths:` filter here any more.
#
# A required check that does not run does not pass — GitHub holds the PR at
# "Expected — waiting for status to be reported", forever. Path-filtering a required
# check therefore blocks every PR that does not touch the filtered paths, which is
# most of them. Same class of silent-coupling trap as BP4 in docs/decisions.md.
#
# The cost concern that motivated the filter is still real, so it moved inside the
# job: the "Is the database in scope?" step below decides, and the expensive steps
# are skipped when it is not. The job still reports, so the gate is satisfiable.
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC — 23:30 IST
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations, seed and authorization suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # fetch-depth: 0 so the scope step below can diff against the PR base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Replaces the old `paths:` trigger filter. On a pull request, run the stack only
      # if this PR actually touches the schema, the seed or this workflow. Everywhere
      # else — nightly, workflow_dispatch — always run.
      #
      # The job reports either way, which is what lets it be a required check.
      - name: Is the database in scope?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "reason=event is ${{ github.event_name }}, always run" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed=$(git diff --name-only "$base" "$head" \
            -- 'supabase/**' '.github/workflows/integration.yml' | head -50)

          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Database-relevant files changed:"
            echo "$changed" | sed 's/^/  /'
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under supabase/ or this workflow — skipping the stack."
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      # The CLI is a devDependency so local and CI run the identical version; a
      # migration that replays here and not on a laptop is a debugging session
      # nobody needs.
      - name: Start the local Supabase stack
        if: steps.scope.outputs.run == 'true'
        run: npx supabase start

      # `db reset` replays every migration from 0001 into an empty database and then
      # applies supabase/seed.sql. If the migration set has a gap, a bad dependency
      # order or a broken seed, it fails here rather than against staging.
      - name: Replay migrations and seed
        if: steps.scope.outputs.run == 'true'
        run: npx supabase db reset

      # Non-negotiable #2. This is the highest-value test in the repository: it asserts
      # an exact policy set, so it fails when a policy is REMOVED and — the direction
      # that actually leaks — when one is ADDED.
      #
      # The output is teed rather than just streamed because "did it pass?" is not the
      # only question this step has to answer. See the guard below.
      - name: Authorization suite (pgTAP)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          npx supabase test db 2>&1 | tee /tmp/pgtap.log

      # E02-24. A colliding fixture id does not fail one assertion — the first insert
      # dies, pg_prove reports `Tests: 0` for that file, and the suite that is supposed
      # to make a public order table impossible silently tests nothing. On 2026-08-08
      # that had already happened: authorization.test.sql contributed zero assertions
      # while the run reported a total.
      #
      # So exit status alone is not evidence. Assert the suite actually ran.
      #
      # MIN_TESTS is a floor, not the real count — it exists so that deleting most of
      # the suite is caught, without this failing every time a legitimate assertion is
      # added. Raise it when the suite grows substantially.
      - name: Guard — the suite must actually have run
        if: always() && steps.scope.outputs.run == 'true'
        env:
          MIN_TESTS: '150'
        run: |
          if [ ! -s /tmp/pgtap.log ]; then
            echo "::error::pgTAP produced no output at all — the suite did not run."
            exit 1
          fi

          # "Dubious" / "No subtests run" is pg_prove telling us a file died before its
          # plan. It is the exact signature of the E02-24 duplicate-key failure.
          if grep -qE 'No subtests run|Dubious' /tmp/pgtap.log; then
            echo "::error::A test file died before running its plan (Dubious / No subtests run)."
            grep -nE 'No subtests run|Dubious|^# ' /tmp/pgtap.log || true
            exit 1
          fi

          # Final line looks like: Files=3, Tests=245, 12 wallclock secs (...)
          total=$(grep -oE 'Tests=[0-9]+' /tmp/pgtap.log | tail -1 | cut -d= -f2)
          if [ -z "$total" ]; then
            echo "::error::Could not find a 'Tests=N' summary in the pgTAP output."
            tail -20 /tmp/pgtap.log
            exit 1
          fi

          echo "pgTAP reported $total assertions (floor: $MIN_TESTS)."
          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $total assertions ran, expected at least $MIN_TESTS."
            echo "Either the suite was cut down deliberately — in which case lower MIN_TESTS"
            echo "in this workflow in the same commit — or a file silently failed to run."
            exit 1
          fi

      - name: Stop
        if: always() && steps.scope.outputs.run == 'true'
        run: npx supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # E14-24. The flow that drives a real build against real staging.
  #
  # It runs here rather than in the smoke test because it needs an emulator and a
  # build — minutes, not the ~60s the smoke budget allows. What the smoke test DOES
  # run is `check:maestro`, which fails in a second if a flow references a testID
  # that no longer exists; a missing id makes Maestro hang until it times out, and a
  # flaky e2e suite gets disabled rather than fixed.
  # ---------------------------------------------------------------------------
  maestro:
    name: Maestro (cart)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Android only for now: an iOS runner needs macOS, and the flow asserts no
    # platform-specific behaviour. Add the macOS matrix leg when one does.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: The flows reference testIDs that exist
        run: npm run check:maestro

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build the staging APK
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --no-install && ./android/gradlew -p android assembleRelease

      - name: Run the cart flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro/cart.yaml --format junit --output maestro-report.xml

      - name: Keep the report even when the flow fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: maestro-report.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The Supabase project settings the repo does not own (docs/environments.md §6).
  #
  # Not in the smoke test on purpose: every failure here is fixed in a dashboard by
  # Andy, not in a pull request, and a red check that no code change can turn green
  # trains people to ignore the check. `continue-on-error` for the same reason — it
  # reports, loudly, without blocking a merge on somebody else's dashboard.
  # ---------------------------------------------------------------------------
  project-config:
    name: Supabase project config (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Assert the dashboard settings the app depends on
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-supabase-config.mjs staging
